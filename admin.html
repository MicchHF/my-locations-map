<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления меток</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=17e91f7c-3356-4174-9a25-5ac34ba55d46&lang=ru_RU"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .photo-preview-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            margin-bottom: 10px;
        }

        .photo-preview-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .photo-preview-item img {
            height: 70px;
            width: auto;
            border-radius: 4px;
            object-fit: cover;
        }

        .photo-controls {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .photo-controls button {
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f0f0f0;
            border-radius: 3px;
        }

        /* Поиск и списки в админке */
        .admin-search-box {
            padding: 10px 15px;
            background: #ffffff;
            border-bottom: 1px solid #eee;
        }

        .admin-search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .admin-cat-group {
            border-bottom: 1px solid #e5e7eb;
        }

        .admin-cat-header {
            padding: 10px 15px;
            background: #f1f5f9;
            font-weight: 600;
            font-size: 0.88rem;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .admin-cat-count {
            background: #cbd5e1;
            color: #1e293b;
            padding: 1px 7px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .admin-loc-item {
            padding: 10px 15px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
        }

        .admin-loc-item:last-child {
            border-bottom: none;
        }

        /* Модальное окно редактирования */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="authModal" class="auth-overlay">
        <div class="auth-box">
            <h2>Вход Администратора</h2>
            <div class="form-group"><label>Email</label><input type="email" id="authEmail"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="authPassword"></div>
            <button class="btn" onclick="login()">Войти</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="header">
            <h1>Админ-панель</h1>
            <button class="btn" onclick="logout()" style="width:auto; padding:4px 8px; font-size:0.75rem;">Выйти</button>
        </div>

        <div style="padding:15px; background:#fafafa; border-bottom:1px solid #eee;">
            <h3>Добавить место</h3>
            
            <div class="form-group">
                <label>Координаты (клик по карте или вставка)</label>
                <input type="text" id="locCoords" placeholder="Например: 55.751574, 37.573856" oninput="handleManualCoords()">
            </div>
            
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="locTitle" placeholder="Название точки">
            </div>
            
            <div class="form-group">
                <label>Категория</label>
                <select id="locCategory">
                    <option value="☕ Кофейни">☕ Кофейни</option>
                    <option value="🍽️ Заведения (рестораны)">🍽️ Заведения (рестораны)</option>
                    <option value="🍸 Бары и тусовки">🍸 Бары и тусовки</option>
                    <option value="🚪 Двери и архитектура">🚪 Двери и архитектура</option>
                    <option value="🏞️ Парки и природа">🏞️ Парки и природа</option>
                    <option value="🏛️ Культура и музеи">🏛️ Культура и музеи</option>
                    <option value="📸 Инсталокации">📸 Инсталокации</option>
                    <option value="🛍️ Шопинг">🛍️ Шопинг</option>
                    <option value="🏨 Отели">🏨 Отели</option>
                    <option value="📍 Другое" selected>📍 Другое</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Адрес</label>
                <input type="text" id="locAddress" placeholder="например, ул. Покровка, 16">
            </div>
            
            <div class="form-group">
                <label>Описание</label>
                <textarea id="locDesc" placeholder="Заметки или рекомендации..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Фотографии</label>
                <input type="file" id="locFiles" multiple accept="image/*" onchange="handleNewFilesSelect(event)">
            </div>

            <div id="newPhotoPreview" class="photo-preview-grid"></div>
            
            <button id="saveBtn" class="btn" onclick="saveLocation()">Сохранить на карту</button>
        </div>

        <!-- Поиск и Группировка меток в Админке -->
        <div id="list-section">
            <div class="admin-search-box">
                <input type="text" id="adminSearchInput" class="admin-search-input" placeholder="🔍 Быстрый поиск метки..." oninput="renderAdminList()">
            </div>
            <div id="admin-locations-list"></div>
        </div>
    </div>

    <div id="map"></div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Редактировать место</h3>
            <input type="hidden" id="editLocId">
            
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="editTitle">
            </div>
            
            <div class="form-group">
                <label>Категория</label>
                <select id="editCategory">
                    <option value="☕ Кофейни">☕ Кофейни</option>
                    <option value="🍽️ Заведения (рестораны)">🍽️ Заведения (рестораны)</option>
                    <option value="🍸 Бары и тусовки">🍸 Бары и тусовки</option>
                    <option value="🚪 Двери и архитектура">🚪 Двери и архитектура</option>
                    <option value="🏞️ Парки и природа">🏞️ Парки и природа</option>
                    <option value="🏛️ Культура и музеи">🏛️ Культура и музеи</option>
                    <option value="📸 Инсталокации">📸 Инсталокации</option>
                    <option value="🛍️ Шопинг">🛍️ Шопинг</option>
                    <option value="🏨 Отели">🏨 Отели</option>
                    <option value="📍 Другое">📍 Другое</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Адрес</label>
                <input type="text" id="editAddress">
            </div>
            
            <div class="form-group">
                <label>Описание</label>
                <textarea id="editDesc"></textarea>
            </div>

            <div class="form-group">
                <label>Текущие фото (изменение порядка: ← / →)</label>
                <div id="editPhotoGrid" class="photo-preview-grid"></div>
            </div>

            <div class="form-group">
                <label>Добавить еще фото</label>
                <input type="file" id="editNewFiles" multiple accept="image/*">
            </div>

            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn" onclick="updateLocation()">Сохранить изменения</button>
                <button class="btn" style="background:#888;" onclick="closeEditModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        let myMap, currentCoords = null, tempPlacemark = null;
        let selectedFiles = [];
        let editCurrentImages = [];
        let allAdminLocations = [];

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) document.getElementById('authModal').style.display = 'none';
        };

        async function login() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else document.getElementById('authModal').style.display = 'none';
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        ymaps.ready(() => {
            myMap = new ymaps.Map("map", { center: [55.751574, 37.573856], zoom: 10 });
            loadAdminLocations();

            myMap.events.add('click', (e) => {
                currentCoords = e.get('coords');
                document.getElementById('locCoords').value = `${currentCoords[0].toFixed(6)}, ${currentCoords[1].toFixed(6)}`;
                updateTempMarker(currentCoords);
            });
        });

        function handleManualCoords() {
            const inputVal = document.getElementById('locCoords').value.trim();
            const parts = inputVal.split(',').map(p => parseFloat(p.trim()));

            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                currentCoords = [parts[0], parts[1]];
                updateTempMarker(currentCoords);
                myMap.setCenter(currentCoords, 15);
            }
        }

        function updateTempMarker(coords) {
            if (tempPlacemark) myMap.geoObjects.remove(tempPlacemark);
            tempPlacemark = new ymaps.Placemark(coords, {}, { preset: 'islands#redIcon' });
            myMap.geoObjects.add(tempPlacemark);
        }

        function handleNewFilesSelect(e) {
            selectedFiles = Array.from(e.target.files);
            renderNewPhotoPreview();
        }

        function renderNewPhotoPreview() {
            const container = document.getElementById('newPhotoPreview');
            container.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'photo-preview-item';
                const url = URL.createObjectURL(file);

                item.innerHTML = `
                    <img src="${url}">
                    <div class="photo-controls">
                        <button onclick="moveNewPhoto(${index}, -1)">←</button>
                        <button onclick="moveNewPhoto(${index}, 1)">→</button>
                        <button style="color:red;" onclick="removeNewPhoto(${index})">✕</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function moveNewPhoto(index, dir) {
            const newIdx = index + dir;
            if (newIdx < 0 || newIdx >= selectedFiles.length) return;
            const temp = selectedFiles[index];
            selectedFiles[index] = selectedFiles[newIdx];
            selectedFiles[newIdx] = temp;
            renderNewPhotoPreview();
        }

        function removeNewPhoto(index) {
            selectedFiles.splice(index, 1);
            renderNewPhotoPreview();
        }

        async function saveLocation() {
            if (!currentCoords) return alert('Укажите координаты!');
            
            const title = document.getElementById('locTitle').value;
            const category = document.getElementById('locCategory').value;
            const address = document.getElementById('locAddress').value;
            const description = document.getElementById('locDesc').value;
            const saveBtn = document.getElementById('saveBtn');
            
            saveBtn.disabled = true;
            const images = [];

            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    saveBtn.innerText = `Загрузка фото ${i + 1}/${selectedFiles.length}...`;

                    const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                    const filePath = `public/${Date.now()}_${cleanName}`;

                    const { error: uploadError } = await supabaseClient.storage
                        .from('location-photos')
                        .upload(filePath, file);

                    if (!uploadError) {
                        const { data } = supabaseClient.storage.from('location-photos').getPublicUrl(filePath);
                        images.push(data.publicUrl);
                    }
                }

                saveBtn.innerText = 'Сохранение...';

                const { error } = await supabaseClient.from('Location').insert([{
                    title, category, address, description, lat: currentCoords[0], lng: currentCoords[1], images
                }]);

                if (error) alert('Ошибка записи: ' + error.message);
                else { alert('Метка успешно добавлена!'); location.reload(); }
            } catch (err) {
                alert('Сбой: ' + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Сохранить на карту';
            }
        }

        async function loadAdminLocations() {
            const { data: locations } = await supabaseClient.from('Location').select('*');
            if (!locations) return;

            allAdminLocations = locations;

            // Отрисовка меток на карте в админке с точным круговым хитбоксом
            myMap.geoObjects.removeAll();
            locations.forEach(loc => {
                const categoryIcon = loc.category ? loc.category.split(' ')[0] : '📍';
                
                const layout = ymaps.templateLayoutFactory.createClass(
                    `<div style="width:34px; height:34px; background:#1e293b; border:2px solid #fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 3px 8px rgba(0,0,0,0.3);"><span>${categoryIcon}</span></div>`
                );

                const placemark = new ymaps.Placemark([loc.lat, loc.lng], { 
                    balloonContent: `<b>${categoryIcon} ${loc.title}</b><br><small>${loc.address || ''}</small>` 
                }, {
                    iconLayout: layout,
                    iconOffset: [-17, -17],
                    iconShape: {
                        type: 'Circle',
                        coordinates: [0, 0],
                        radius: 17
                    },
                    cursor: 'pointer'
                });

                myMap.geoObjects.add(placemark);
            });

            renderAdminList();
        }

        // Отрисовка списка админки с группировкой по категориям и фильтрацией поиска
        function renderAdminList() {
            const listEl = document.getElementById('admin-locations-list');
            const searchVal = (document.getElementById('adminSearchInput').value || '').toLowerCase().trim();

            listEl.innerHTML = '';

            const filtered = allAdminLocations.filter(loc => {
                return (loc.title || '').toLowerCase().includes(searchVal) ||
                       (loc.address || '').toLowerCase().includes(searchVal);
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="padding:15px; color:#888; text-align:center;">Ничего не найдено</div>';
                return;
            }

            const grouped = {};
            filtered.forEach(loc => {
                const cat = loc.category || '📍 Другое';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(loc);
            });

            Object.keys(grouped).forEach(catName => {
                const groupContainer = document.createElement('div');
                groupContainer.className = 'admin-cat-group';

                const itemsCount = grouped[catName].length;

                groupContainer.innerHTML = `
                    <div class="admin-cat-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
                        <span>${catName}</span>
                        <span class="admin-cat-count">${itemsCount}</span>
                    </div>
                    <div class="admin-cat-items"></div>
                `;

                const itemsContainer = groupContainer.querySelector('.admin-cat-items');

                grouped[catName].forEach(loc => {
                    const categoryIcon = loc.category ? loc.category.split(' ')[0] : '📍';
                    const item = document.createElement('div');
                    item.className = 'admin-loc-item';
                    item.innerHTML = `
                        <div style="flex:1; padding-right:10px;">
                            <strong>${categoryIcon} ${loc.title}</strong><br>
                            <small style="color:#666;">${loc.address || 'Без адреса'}</small>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button onclick="openEditModal('${loc.id}')">✏️</button>
                            <button style="color:red;" onclick="deleteLocation('${loc.id}')">🗑️</button>
                        </div>
                    `;
                    itemsContainer.appendChild(item);
                });

                listEl.appendChild(groupContainer);
            });
        }

        function openEditModal(id) {
            const loc = allAdminLocations.find(l => l.id === id);
            if (!loc) return;

            document.getElementById('editLocId').value = loc.id;
            document.getElementById('editTitle').value = loc.title || '';
            document.getElementById('editCategory').value = loc.category || '📍 Другое';
            document.getElementById('editAddress').value = loc.address || '';
            document.getElementById('editDesc').value = loc.description || '';

            editCurrentImages = Array.isArray(loc.images) ? [...loc.images] : [];
            renderEditPhotoGrid();

            document.getElementById('editModal').classList.add('active');
        }

        function renderEditPhotoGrid() {
            const grid = document.getElementById('editPhotoGrid');
            grid.innerHTML = '';

            editCurrentImages.forEach((imgUrl, index) => {
                const item = document.createElement('div');
                item.className = 'photo-preview-item';
                item.innerHTML = `
                    <img src="${imgUrl}">
                    <div class="photo-controls">
                        <button onclick="moveEditPhoto(${index}, -1)">←</button>
                        <button onclick="moveEditPhoto(${index}, 1)">→</button>
                        <button style="color:red;" onclick="removeEditPhoto(${index})">✕</button>
                    </div>
                `;
                grid.appendChild(item);
            });
        }

        function moveEditPhoto(index, dir) {
            const newIdx = index + dir;
            if (newIdx < 0 || newIdx >= editCurrentImages.length) return;
            const temp = editCurrentImages[index];
            editCurrentImages[index] = editCurrentImages[newIdx];
            editCurrentImages[newIdx] = temp;
            renderEditPhotoGrid();
        }

        function removeEditPhoto(index) {
            editCurrentImages.splice(index, 1);
            renderEditPhotoGrid();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function updateLocation() {
            const id = document.getElementById('editLocId').value;
            const title = document.getElementById('editTitle').value;
            const category = document.getElementById('editCategory').value;
            const address = document.getElementById('editAddress').value;
            const description = document.getElementById('editDesc').value;
            const newFiles = document.getElementById('editNewFiles').files;

            const updatedImages = [...editCurrentImages];

            for (let file of newFiles) {
                const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                const filePath = `public/${Date.now()}_${cleanName}`;

                const { error: uploadError } = await supabaseClient.storage.from('location-photos').upload(filePath, file);
                if (!uploadError) {
                    const { data } = supabaseClient.storage.from('location-photos').getPublicUrl(filePath);
                    updatedImages.push(data.publicUrl);
                }
            }

            const { error } = await supabaseClient.from('Location').update({
                title, category, address, description, images: updatedImages
            }).eq('id', id);

            if (error) alert('Ошибка обновления: ' + error.message);
            else { alert('Сохранено!'); location.reload(); }
        }

        async function deleteLocation(id) {
            if (confirm('Удалить эту метку?')) {
                await supabaseClient.from('Location').delete().eq('id', id);
                location.reload();
            }
        }
    </script>
</body>
</html>
