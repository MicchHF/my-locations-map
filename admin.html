<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f3f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Панель управления | @dalazareva локации</title>
    
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://api-maps.yandex.ru/2.1/?apikey=7370bad5-a627-4414-a1e8-b2023bda7a61&lang=ru_RU"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/shared.js"></script>

    <style>
        .auth-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100%;
            background: #09090b; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-box {
            background: #ffffff; width: 100%; max-width: 360px; padding: 28px; border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 14px;
        }
        .auth-title { font-size: 1.15rem; font-weight: 700; color: #0f172a; text-align: center; }
        .auth-desc { font-size: 0.8rem; color: #64748b; text-align: center; margin-top: -6px; margin-bottom: 4px; }
        .auth-error { font-size: 0.78rem; color: #ef4444; background: #fee2e2; padding: 8px 10px; border-radius: 8px; display: none; }

        .admin-badge { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 0.88rem; font-weight: 600; }
        .logout-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; }
        
        .admin-form-container { 
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; 
            margin-bottom: 8px; overflow: hidden; 
        }
        .admin-form-header {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
            cursor: pointer; user-select: none; background: #f1f5f9;
        }
        .admin-form-title { font-size: 0.88rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 6px; }
        .form-chevron { font-size: 0.75rem; transition: transform 0.2s; color: #64748b; }
        .admin-form-container.collapsed .form-chevron { transform: rotate(-90deg); }
        .admin-form-container.collapsed .admin-form-body { display: none; }
        .admin-form-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        
        .form-input, .form-select, .form-textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.82rem; outline: none; background: #fff; }
        .form-textarea { resize: vertical; min-height: 50px; }

        .btn-mini { padding: 6px 10px; background: #0f172a; color: #fff; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }

        .file-upload-label { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border: 1px dashed #0f172a; border-radius: 8px; background: #fff; color: #0f172a; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
        .file-upload-input { display: none; }
        .upload-status { font-size: 0.75rem; color: #64748b; }

        .metro-field-group { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 8px; margin-bottom: 4px; display: flex; flex-direction: column; gap: 4px; }
        .metro-field-row { display: flex; gap: 6px; align-items: center; }

        .submit-btn { background: #0f172a; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .submit-btn:hover { background: #1e293b; }

        .modal-overlay { position: fixed; inset: 0; width: 100vw; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; width: 92%; max-width: 520px; max-height: 90vh; border-radius: 16px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .modal-title { font-weight: 700; font-size: 1.1rem; color: #0f172a; }
        .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #64748b; }

        .edit-photos-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .edit-photo-item { position: relative; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid #cbd5e1; background: #f8fafc; flex-shrink: 0; }
        .edit-photo-item img { height: 100%; width: auto; object-fit: cover; cursor: pointer; }
        .photo-controls { position: absolute; top: 3px; right: 3px; left: 3px; display: flex; justify-content: space-between; gap: 4px; pointer-events: none; }
        .photo-btn { background: rgba(0,0,0,0.75); color: #fff; border: none; border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; pointer-events: auto; }
        .photo-btn-delete { background: rgba(239,68,68,0.9); }
    </style>
</head>
<body>

        <div class="auth-box">
            <div class="auth-title">🔐 Вход в Админ-панель</div>
            <div class="auth-desc">Доступ только для владельца</div>
            <div id="authError" class="auth-error"></div>
            <input type="email" id="authEmail" class="form-input" placeholder="Email">
            <input type="password" id="authPassword" class="form-input" placeholder="Пароль">
            <button id="authBtn" class="submit-btn" onclick="handleLogin()">Войти</button>
        </div>
    </div>

    <div id="app-wrapper">

            <div class="sidebar-header">
                <div class="admin-badge">
                    <span>⚡ Панель Администратора</span>
                    <button class="logout-btn" onclick="handleLogout()">Выйти</button>
                </div>

                <div id="adminFormContainer" class="admin-form-container">
                    <div class="admin-form-header" onclick="toggleAddForm()">
                        <div class="admin-form-title">
                            <span>➕ Добавить новую точку</span>

                        <span class="form-chevron">▼</span>
                    </div>

                    <div class="admin-form-body">
                        <input type="text" id="addTitle" class="form-input" placeholder="Название точки *">
                        
                        <!-- Список категорий наполняется динамически из shared.js -->
                        <select id="addCategorySelect" class="form-select" onchange="handleCategorySelectChange(this)"></select>
                        <input type="text" id="addCustomCategory" class="form-input" placeholder="Введите название категории" style="display: none;">

                        <div style="display: flex; gap: 6px;">
                            <input type="text" id="addCoords" class="form-input" placeholder="Координаты (клик или ввод)" oninput="onCoordsInput('add')">
                            <button type="button" class="btn-mini" onclick="manualResolveAddress('add')">📍 Найти адрес</button>
                        </div>
                        <input type="text" id="addAddress" class="form-input" placeholder="Адрес (автоматически)">
                        
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <label class="upload-status">🚇 Метро (автоматически при вводе координат):</label>
                            
                            <div class="metro-field-group">
                                <select id="addMetro1_line" class="form-select" onchange="onLineChange('add', 1)"></select>
                                <div class="metro-field-row">
                                    <select id="addMetro1_station" class="form-select" style="flex:2;"></select>
                                    <input type="number" id="addMetro1_time" class="form-input" placeholder="Мин" style="flex:1;">
                                </div>
                            </div>

                            <div class="metro-field-group">
                                <select id="addMetro2_line" class="form-select" onchange="onLineChange('add', 2)"></select>
                                <div class="metro-field-row">
                                    <select id="addMetro2_station" class="form-select" style="flex:2;"></select>
                                    <input type="number" id="addMetro2_time" class="form-input" placeholder="Мин" style="flex:1;">
                                </div>
                            </div>

                            <div class="metro-field-group">
                                <select id="addMetro3_line" class="form-select" onchange="onLineChange('add', 3)"></select>
                                <div class="metro-field-row">
                                    <select id="addMetro3_station" class="form-select" style="flex:2;"></select>
                                    <input type="number" id="addMetro3_time" class="form-input" placeholder="Мин" style="flex:1;">
                                </div>
                            </div>
                        </div>

                        <textarea id="addDesc" class="form-textarea" placeholder="Описание"></textarea>
                        
                        <label class="file-upload-label">
                            <span>📷 Выбрать фото...</span>
                            <input type="file" id="addPhotosInput" class="file-upload-input" accept="image/*" multiple onchange="handleFileSelection(this)">
                        </label>
                        <div id="uploadStatus" class="upload-status"></div>

                        <button id="saveBtn" class="submit-btn" onclick="saveNewLocation()">＋ Сохранить локацию</button>
                    </div>
                </div>

                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию, адресу, метро..." oninput="handleSearch()">
                </div>
            </div>
            
            <div id="locations-list"></div>
        </div>

        <div id="map-container" style="inset: 0 0 0 440px; width: calc(100vw - 440px);">
            <div id="map"></div>
            <div id="topCatFilterBar" class="top-cat-filter-bar">
                <button id="toggleAllBtn" class="toggle-all-btn" onclick="toggleAllCategories()">👁️ Все</button>
                <div id="catChipsScroll" class="cat-chips-scroll"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Редактирование локации</div>
                <button class="modal-close" onclick="closeEditModal()">✕</button>
            </div>
            <input type="hidden" id="editLocationId">
            <div>
                <label class="upload-status">Название *</label>
                <input type="text" id="editTitle" class="form-input">
            </div>
            <div>
                <label class="upload-status">Категория</label>
                <select id="editCategorySelect" class="form-select"></select>
            </div>
            <div>
                <label class="upload-status">Координаты</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="editCoords" class="form-input" oninput="onCoordsInput('edit')">
                    <button type="button" class="btn-mini" onclick="manualResolveAddress('edit')">📍 Найти адрес</button>
                </div>

            <div>
                <label class="upload-status">Адрес</label>
                <input type="text" id="editAddress" class="form-input">
            </div>
            <div>
                <label class="upload-status">🚇 Станции метро рядом</label>
                <div class="metro-field-group">
                    <select id="editMetro1_line" class="form-select" onchange="onLineChange('edit', 1)"></select>
                    <div class="metro-field-row">
                        <select id="editMetro1_station" class="form-select" style="flex:2;"></select>
                        <input type="number" id="editMetro1_time" class="form-input" placeholder="Мин" style="flex:1;">
                    </div>
                </div>
                <div class="metro-field-group">
                    <select id="editMetro2_line" class="form-select" onchange="onLineChange('edit', 2)"></select>
                    <div class="metro-field-row">
                        <select id="editMetro2_station" class="form-select" style="flex:2;"></select>
                        <input type="number" id="editMetro2_time" class="form-input" placeholder="Мин" style="flex:1;">
                    </div>
                </div>
                <div class="metro-field-group">
                    <select id="editMetro3_line" class="form-select" onchange="onLineChange('edit', 3)"></select>
                    <div class="metro-field-row">
                        <select id="editMetro3_station" class="form-select" style="flex:2;"></select>
                        <input type="number" id="editMetro3_time" class="form-input" placeholder="Мин" style="flex:1;">
                    </div>

            <div>
                <label class="upload-status">Описание</label>
                <textarea id="editDesc" class="form-textarea"></textarea>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <span class="lightbox-nav lightbox-prev" onclick="prevImage()">&#10094;</span>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Фото">
        <span class="lightbox-nav lightbox-next" onclick="nextImage()">&#10095;</span>
        <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>

    <div class="mobile-toggle-bar">
        <button id="btn-map-view" class="toggle-btn active" onclick="switchMobileView('map')">🗺️ Карта</button>
        <button id="btn-list-view" class="toggle-btn" onclick="switchMobileView('list')">📋 Список</button>
    </div>

    <script>
        let myMap;
        let tempPlacemark = null;
        let allLocations = [];
        let categoryCollections = {};
        let categoryVisibility = {};
        let allVisibleState = true;
        let selectedFiles = [];
        let editingImagesList = [];
        let editNewFiles = [];
        let currentGallery = [];
        let currentImageIdx = 0;

        function toggleAddForm() {
            document.getElementById('adminFormContainer').classList.toggle('collapsed');
        }

        function populateMetroLineSelects() {
            ['add', 'edit'].forEach(prefix => {
                for (let i = 1; i <= 3; i++) {
                    const lineSelect = document.getElementById(`${prefix}Metro${i}_line`);
                    if (!lineSelect) continue;
                    lineSelect.innerHTML = '<option value="">-- Выберите линию метро --</option>';
                    MOSCOW_METRO_DATA.forEach(line => {
                        const opt = document.createElement('option');
                        opt.value = line.id;
                        opt.innerText = `● ${line.name}`;
                        opt.style.color = line.color;
                        lineSelect.appendChild(opt);
                    });
                    onLineChange(prefix, i);
                }
            });
        }

        function onLineChange(prefix, idx, preselectedStation = "") {
            const lineSelect = document.getElementById(`${prefix}Metro${idx}_line`);
            const stationSelect = document.getElementById(`${prefix}Metro${idx}_station`);
            const selectedLineId = lineSelect.value;

            stationSelect.innerHTML = '<option value="">-- Станция --</option>';
            if (!selectedLineId) return;

            const lineData = MOSCOW_METRO_DATA.find(l => l.id === selectedLineId);
            if (lineData && lineData.stations) {
                lineData.stations.forEach(st => {
                    const stName = typeof st === 'string' ? st : st.name;
                    const opt = document.createElement('option');
                    opt.value = stName;
                    opt.innerText = stName;
                    if (stName === preselectedStation) opt.selected = true;
                    stationSelect.appendChild(opt);
                });
            }
        }

        function getMetroFromInputs(prefix) {
            const metro = [];
            for (let i = 1; i <= 3; i++) {
                const lineId = document.getElementById(`${prefix}Metro${i}_line`).value;
                const station = document.getElementById(`${prefix}Metro${i}_station`).value;
                const time = parseInt(document.getElementById(`${prefix}Metro${i}_time`).value);
                if (station) {
                    const lineData = MOSCOW_METRO_DATA.find(l => l.id === lineId);
                    const color = lineData ? lineData.color : "#EF161E";
                    metro.push({ name: station, line: lineData ? lineData.name : "", color, time: isNaN(time) ? null : time });
                }
            }
            return metro;
        }

        function setMetroToInputs(prefix, metroList) {
            for (let i = 1; i <= 3; i++) {
                const item = metroList && metroList[i - 1] ? metroList[i - 1] : null;
                const lineSelect = document.getElementById(`${prefix}Metro${i}_line`);
                const timeInput = document.getElementById(`${prefix}Metro${i}_time`);
                
                if (item) {
                    const stName = item.name || item.stationName;
                    let matchedLine = MOSCOW_METRO_DATA.find(l => l.id === item.lineId || (l.stations && l.stations.some(s => (typeof s === 'string' ? s : s.name) === stName)));
                    if (matchedLine) {
                        lineSelect.value = matchedLine.id;
                        onLineChange(prefix, i, stName);
                    } else {
                        lineSelect.value = "";
                        onLineChange(prefix, i);
                    }
                    timeInput.value = item.time || '';
                } else {
                    lineSelect.value = "";
                    onLineChange(prefix, i);
                    timeInput.value = '';
                }
            }
        }

        async function checkAuth() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const overlay = document.getElementById('authOverlay');
                const wrapper = document.getElementById('app-wrapper');
                if (session) {
                    overlay.style.display = 'none';
                    wrapper.style.display = 'flex';
                    updateCategorySelectOptions();
                    ymaps.ready(() => {
                        initMap();
                        populateMetroLineSelects();
                    });
                } else {
                    overlay.style.display = 'flex';
                    wrapper.style.display = 'none';
                }
            } catch (e) {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        }

        async function handleLogin() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errDiv = document.getElementById('authError');
            const btn = document.getElementById('authBtn');

            if (!email || !password) {
                errDiv.innerText = "Введите Email и Пароль!";
                errDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = "Проверка...";
            errDiv.style.display = 'none';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            btn.disabled = false;
            btn.innerText = "Войти";

            if (error) {
                errDiv.innerText = error.message;
                errDiv.style.display = 'block';
            } else {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('app-wrapper').style.display = 'flex';
                updateCategorySelectOptions();
                ymaps.ready(() => {
                    initMap();
                    populateMetroLineSelects();
                });
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function fetchAddressFromCoords(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1&accept-language=ru`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.display_name) {
                        const parts = [];
                        const a = data.address || {};
                        if (a.city || a.town || a.village) parts.push(a.city || a.town || a.village);
                        if (a.road) parts.push(a.road);
                        if (a.house_number) parts.push(a.house_number);
                        return parts.length > 0 ? parts.join(', ') : data.display_name.split(',').slice(0, 3).join(',');
                    }
                }
            } catch (e) {}

            try {
                const res = await ymaps.geocode([lat, lng], { results: 1 });
                const firstGeoObject = res.geoObjects.get(0);
                if (firstGeoObject) return firstGeoObject.getAddressLine() || '';
            } catch (err) {}

            return '';
        }

        function onCoordsInput(prefix) {
            const coordsStr = document.getElementById(`${prefix}Coords`).value.trim();
            const parts = coordsStr.split(',').map(s => parseFloat(s.trim()));
            if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1]) && parts[0] > 0 && parts[1] > 0) {
                const lat = parts[0];
                const lng = parts[1];
                
                if (tempPlacemark) {
                    tempPlacemark.geometry.setCoordinates([lat, lng]);
                } else if (myMap) {
                    tempPlacemark = new ymaps.Placemark([lat, lng], {}, { preset: 'islands#darkOrangeDotIcon' });
                    myMap.geoObjects.add(tempPlacemark);
                }

                if (myMap) myMap.panTo([lat, lng], { duration: 300 });

                const nearest = findNearestMetroStations(lat, lng);
                setMetroToInputs(prefix, nearest);
            }
        }

        async function manualResolveAddress(prefix) {
            const coordsStr = document.getElementById(`${prefix}Coords`).value.trim();
            if (!coordsStr) { alert("Сначала укажите координаты (кликните по карте или введите)!"); return; }
            
            const parts = coordsStr.split(',').map(s => parseFloat(s.trim()));
            if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) {
                alert("Неверный формат координат!"); return;
            }

            const lat = parts[0];
            const lng = parts[1];

            if (tempPlacemark) {
                tempPlacemark.geometry.setCoordinates([lat, lng]);
            } else if (myMap) {
                tempPlacemark = new ymaps.Placemark([lat, lng], {}, { preset: 'islands#darkOrangeDotIcon' });
                myMap.geoObjects.add(tempPlacemark);
            }
            if (myMap) myMap.panTo([lat, lng], { duration: 300 });

            const nearest = findNearestMetroStations(lat, lng);
            setMetroToInputs(prefix, nearest);

            const addrInput = document.getElementById(`${prefix}Address`);
            addrInput.value = "Поиск адреса...";

            const resolvedAddr = await fetchAddressFromCoords(lat, lng);
            if (resolvedAddr) {
                addrInput.value = resolvedAddr;
            } else {
                addrInput.value = '';
                alert("Не удалось определить адрес по координатам.");
            }
        }

        function initMap() {
            if (myMap) return;

            myMap = new ymaps.Map("map", {
                center: [55.751574, 37.573856],
                zoom: 12,
                controls: ['zoomControl', 'geolocationControl']
            }, {
                autoFitToViewport: 'always'
            });

            myMap.events.add('click', async function (e) {
                const coords = e.get('coords');
                document.getElementById('addCoords').value = `${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`;
                
                if (tempPlacemark) {
                    tempPlacemark.geometry.setCoordinates(coords);
                } else {
                    tempPlacemark = new ymaps.Placemark(coords, {}, { preset: 'islands#darkOrangeDotIcon' });
                    myMap.geoObjects.add(tempPlacemark);
                }

                const autoAddress = await fetchAddressFromCoords(coords[0], coords[1]);
                if (autoAddress) document.getElementById('addAddress').value = autoAddress;

                const nearestStations = findNearestMetroStations(coords[0], coords[1]);
                setMetroToInputs('add', nearestStations);

                document.getElementById('adminFormContainer').classList.remove('collapsed');
            });

            loadLocations();
            window.addEventListener('resize', () => { if (myMap) myMap.container.fitToViewport(); });
        }

        async function compressImage(file, maxWidth = 1400, quality = 0.82) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        } else if (height > maxWidth) {
                            width = Math.round((width * maxWidth) / height);
                            height = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(blob => resolve(blob || file), 'image/webp', quality);
                    };
                    img.onerror = () => resolve(file);
                };
                reader.onerror = () => resolve(file);
            });
        }

        async function uploadImagesToSupabase(files, folderId) {
            const uploadedUrls = [];
            const safeFolder = folderId ? folderId.toString().replace(/[^a-zA-Z0-9_-]/g, '') : 'general';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const compressedBlob = await compressImage(file);
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.webp`;
                const filePath = `${safeFolder}/${fileName}`;

                const { data, error } = await supabaseClient.storage.from('location-photos').upload(filePath, compressedBlob, {
                    contentType: 'image/webp'
                });

                if (!error && data) {
                    const { data: publicUrlData } = supabaseClient.storage.from('location-photos').getPublicUrl(filePath);
                    if (publicUrlData) uploadedUrls.push(publicUrlData.publicUrl);
                }
            }
            return uploadedUrls;
        }

        async function loadLocations() {
            const { data, error } = await supabaseClient.from('Location').select('*');
            if (error) { console.error("Ошибка загрузки:", error); return; }
            allLocations = data || [];
            updateCategorySelectOptions();
            renderInterface(allLocations);
        }

        function updateCategorySelectOptions() {
            const select = document.getElementById('addCategorySelect');
            if (!select) return;
            const customCategoriesFromDb = allLocations.map(l => l.category).filter(Boolean);
            const mergedCategories = Array.from(new Set([...DEFAULT_CATEGORIES, ...customCategoriesFromDb]));
            
            select.innerHTML = '';
            mergedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat;
                if (cat === "📍 Другое") opt.selected = true;
                select.appendChild(opt);
            });

            const optNew = document.createElement('option');
            optNew.value = '__NEW__'; optNew.innerText = '＋ Создать новую категорию...';
            select.appendChild(optNew);
        }

        function handleCategorySelectChange(selectEl) {
            const customInput = document.getElementById('addCustomCategory');
            customInput.style.display = selectEl.value === '__NEW__' ? 'block' : 'none';
        }

        function handleFileSelection(inputEl) {
            selectedFiles = Array.from(inputEl.files);
            document.getElementById('uploadStatus').innerText = selectedFiles.length > 0 ? `Выбрано файлов: ${selectedFiles.length}` : '';
        }

        async function saveNewLocation() {
            const saveBtn = document.getElementById('saveBtn');
            const title = document.getElementById('addTitle').value.trim();
            const selectCat = document.getElementById('addCategorySelect').value;
            const customCat = document.getElementById('addCustomCategory').value.trim();
            const category = selectCat === '__NEW__' ? customCat : selectCat;
            const address = document.getElementById('addAddress').value.trim();
            const coordsStr = document.getElementById('addCoords').value.trim();
            const description = document.getElementById('addDesc').value.trim();
            const metro = getMetroFromInputs('add');

            if (!title || !coordsStr) { alert("Укажите Название и Координаты!"); return; }

            const coordsParts = coordsStr.split(',').map(s => parseFloat(s.trim()));
            if (coordsParts.length < 2 || isNaN(coordsParts[0]) || isNaN(coordsParts[1])) {
                alert("Неверные координаты!"); return;
            }

            saveBtn.disabled = true;
            document.getElementById('uploadStatus').innerText = "Оптимизация и сохранение...";

            const locationFolderId = `loc_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
            let images = selectedFiles.length > 0 ? await uploadImagesToSupabase(selectedFiles, locationFolderId) : [];

            const { error } = await supabaseClient.from('Location').insert([{
                title, category: category || "📍 Другое", address, lat: coordsParts[0], lng: coordsParts[1], description, images, metro
            }]);

            saveBtn.disabled = false;

            if (error) alert("Ошибка: " + error.message);
            else {
                document.getElementById('addTitle').value = '';
                document.getElementById('addAddress').value = '';
                document.getElementById('addCoords').value = '';
                document.getElementById('addDesc').value = '';
                document.getElementById('addPhotosInput').value = '';
                document.getElementById('uploadStatus').innerText = '';
                setMetroToInputs('add', []);
                if (tempPlacemark) { myMap.geoObjects.remove(tempPlacemark); tempPlacemark = null; }
                selectedFiles = [];
                loadLocations();
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allLocations.filter(loc => {
                const titleMatch = (loc.title || '').toLowerCase().includes(query);
                const addressMatch = (loc.address || '').toLowerCase().includes(query);
                const descMatch = (loc.description || '').toLowerCase().includes(query);
                const metroMatch = loc.metro && Array.isArray(loc.metro) && loc.metro.some(m => (m.name || m.stationName || '').toLowerCase().includes(query));
                return titleMatch || addressMatch || descMatch || metroMatch;
            });
            renderInterface(filtered);
        }

        function renderMetroBadges(metroList) {
            if (!metroList || !Array.isArray(metroList) || metroList.length === 0) return '';
            return `<div class="card-metro-block">${metroList.map(m => {
                const name = m.name || m.stationName || '';
                const isMck = (name && name.includes('МЦК')) || m.color === '#DF4842';
                return `
                <span class="metro-badge">
                    ${getMetroSvg(m.color || '#EF161E', isMck)}
                    ${name} ${m.time ? `<span style="color:#64748b; font-weight:400;">(${m.time} мин)</span>` : ''}
                </span>
            `}).join('')}</div>`;
        }

        function renderInterface(locationsToRender) {
            const listEl = document.getElementById('locations-list');
            listEl.innerHTML = '';
            const grouped = {};
            
            locationsToRender.forEach(loc => {
                const cat = loc.category || '📍 Другое';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(loc);
            });

            Object.values(categoryCollections).forEach(coll => myMap.geoObjects.remove(coll));
            categoryCollections = {};

            const activeCategoriesList = Object.keys(grouped);
            renderTopCatFilter(activeCategoriesList);

            activeCategoriesList.forEach(catName => {
                if (categoryVisibility[catName] === undefined) categoryVisibility[catName] = true;

                const collection = new ymaps.GeoObjectCollection({}, { visible: categoryVisibility[catName] });
                categoryCollections[catName] = collection;
                myMap.geoObjects.add(collection);

                const groupEl = document.createElement('div');
                groupEl.className = 'category-group';
                const isVisible = categoryVisibility[catName];
                
                groupEl.innerHTML = `
                    <div class="category-header">
                        <div class="category-title-wrap" onclick="toggleAccordion(this)">
                            <span class="category-title">${catName}</span>
                            <span class="category-count">${grouped[catName].length}</span>
                        </div>
                        <div class="category-controls">
                            <button class="toggle-visibility-btn" id="icon-cat-${encodeURIComponent(catName)}" onclick="toggleCategoryMap('${catName}', event)">
                                ${isVisible ? '👁️' : '🙈'}
                            </button>
                            <span class="chevron" onclick="toggleAccordion(this)">▼</span>
                        </div>
                    </div>
                    <div class="category-content"></div>
                `;

                const contentEl = groupEl.querySelector('.category-content');

                grouped[catName].forEach(loc => {
                    const categoryIcon = loc.category ? loc.category.split(' ')[0] : '📍';
                    const pinColor = getCategoryPinColor(loc.category);
                    
                    const layout = ymaps.templateLayoutFactory.createClass(
                        `<div class="custom-map-pin" style="background: ${pinColor};"><span>${categoryIcon}</span></div>`
                    );

                    const placemark = new ymaps.Placemark([loc.lat, loc.lng], {
                        hintContent: loc.title,
                        balloonContent: createBalloonHTML(loc)
                    }, {
                        iconLayout: layout, iconOffset: [-19, -19],
                        iconShape: { type: 'Circle', coordinates: [19, 19], radius: 19 },
                        cursor: 'pointer'
                    });

                    collection.add(placemark);

                    const cardEl = document.createElement('div');
                    cardEl.className = 'location-card';
                    cardEl.onclick = (e) => {
                        if (!e.target.closest('button') && !e.target.classList.contains('card-photo-thumb')) {
                            selectLocationOnMap(loc, placemark);
                        }
                    };

                    let photosHtml = '';
                    if (loc.images && Array.isArray(loc.images) && loc.images.length > 0) {
                        photosHtml = `<div class="card-photos">
                            ${loc.images.map((imgUrl, index) => `<img src="${imgUrl}" loading="lazy" class="card-photo-thumb" onclick="openLightboxFromLoc('${loc.id}', ${index}, event)">`).join('')}
                        </div>`;
                    }

                    cardEl.innerHTML = `
                        <div class="card-title">${loc.title}</div>
                        ${loc.address ? `<div class="card-address">📍 ${loc.address}</div>` : ''}
                        ${renderMetroBadges(loc.metro)}
                        ${photosHtml}
                        <div class="card-actions-row">
                            <button class="edit-btn" onclick="openEditModal('${loc.id}', event)">✏️ Редактировать</button>
                            <button class="delete-btn" onclick="deleteLocation('${loc.id}', event)">🗑️ Удалить</button>
                        </div>
                    `;
                    contentEl.appendChild(cardEl);
                });
                listEl.appendChild(groupEl);
            });
        }

        function createBalloonHTML(loc) {
            let photosHtml = '';
            if (loc.images && Array.isArray(loc.images) && loc.images.length > 0) {
                photosHtml = `<div class="balloon-photos">
                    ${loc.images.map((img, index) => `<img src="${img}" loading="lazy" class="balloon-photo-img" onclick="openLightboxFromLoc('${loc.id}', ${index}, event)">`).join('')}
                </div>`;
            }

            let metroHtml = '';
            if (loc.metro && Array.isArray(loc.metro) && loc.metro.length > 0) {
                metroHtml = `<div class="balloon-metro-block">${loc.metro.map(m => {
                    const name = m.name || m.stationName || '';
                    const isMck = (name && name.includes('МЦК')) || m.color === '#DF4842';
                    return `
                    <span class="metro-badge">
                        ${getMetroSvg(m.color || '#EF161E', isMck)}
                        ${name} ${m.time ? `<span style="color:#64748b; font-weight:400;">(${m.time} мин)</span>` : ''}
                    </span>
                `}).join('')}</div>`;
            }

            return `
                <div class="balloon-wrapper">
                    <div class="balloon-title">${loc.title}</div>
                    ${loc.address ? `<div class="balloon-address">📍 ${loc.address}</div>` : ''}
                    ${metroHtml}
                    <button class="balloon-btn" onclick="openEditModal('${loc.id}')">✏️ Редактировать</button>
                    ${loc.description ? `<div class="balloon-desc">${loc.description}</div>` : ''}
                    ${photosHtml}
                </div>
            `;
        }

        function renderTopCatFilter(categories) {
            const container = document.getElementById('catChipsScroll');
            container.innerHTML = '';
            categories.forEach(catName => {
                const isVis = categoryVisibility[catName] !== false;
                const chip = document.createElement('div');
                chip.className = `cat-chip ${isVis ? 'active' : 'disabled'}`;
                chip.innerHTML = `<span>${catName}</span>`;
                chip.onclick = () => toggleCategoryMap(catName);
                container.appendChild(chip);
            });

            const toggleAllBtn = document.getElementById('toggleAllBtn');
            toggleAllBtn.className = `toggle-all-btn ${allVisibleState ? '' : 'off'}`;
            toggleAllBtn.innerText = allVisibleState ? '👁️ Все' : '🙈 Все';
        }

        function toggleCategoryMap(catName, event) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            categoryVisibility[catName] = !categoryVisibility[catName];
            
            if (categoryCollections[catName]) {
                categoryCollections[catName].options.set('visible', categoryVisibility[catName]);
            }

            const listIcon = document.getElementById(`icon-cat-${encodeURIComponent(catName)}`);
            if (listIcon) listIcon.innerText = categoryVisibility[catName] ? '👁️' : '🙈';

            renderTopCatFilter(Object.keys(categoryCollections));
        }

        function toggleAllCategories() {
            allVisibleState = !allVisibleState;
            Object.keys(categoryCollections).forEach(catName => {
                categoryVisibility[catName] = allVisibleState;
                if (categoryCollections[catName]) {
                    categoryCollections[catName].options.set('visible', allVisibleState);
                }
                const listIcon = document.getElementById(`icon-cat-${encodeURIComponent(catName)}`);
                if (listIcon) listIcon.innerText = allVisibleState ? '👁️' : '🙈';
            });
            renderTopCatFilter(Object.keys(categoryCollections));
        }

        function openEditModal(id, event) {
            if (event) event.stopPropagation();
            const loc = allLocations.find(l => l.id === id);
            if (!loc) return;

            document.getElementById('editLocationId').value = loc.id;
            document.getElementById('editTitle').value = loc.title || '';
            document.getElementById('editAddress').value = loc.address || '';
            document.getElementById('editCoords').value = `${loc.lat}, ${loc.lng}`;
            document.getElementById('editDesc').value = loc.description || '';

            setMetroToInputs('edit', loc.metro || []);

            const select = document.getElementById('editCategorySelect');
            select.innerHTML = '';
            const customCategoriesFromDb = allLocations.map(l => l.category).filter(Boolean);
            const mergedCategories = Array.from(new Set([...DEFAULT_CATEGORIES, ...customCategoriesFromDb]));
            mergedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat;
                if (cat === loc.category) opt.selected = true;
                select.appendChild(opt);
            });

            editingImagesList = loc.images ? [...loc.images] : [];
            editNewFiles = [];
            document.getElementById('editUploadStatus').innerText = '';
            renderEditPhotosGrid();

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function renderEditPhotosGrid() {
            const grid = document.getElementById('editPhotosGrid');
            grid.innerHTML = '';
            editingImagesList.forEach((url, idx) => {
                const item = document.createElement('div');
                item.className = 'edit-photo-item';
                item.innerHTML = `
                    <img src="${url}" loading="lazy" onclick="openLightboxDirect(editingImagesList, ${idx}, event)">
                    <div class="photo-controls">
                        <div>
                            ${idx > 0 ? `<button class="photo-btn" onclick="movePhoto(${idx}, -1)">◀</button>` : ''}
                            ${idx < editingImagesList.length - 1 ? `<button class="photo-btn" onclick="movePhoto(${idx}, 1)">▶</button>` : ''}
                        </div>
                        <button class="photo-btn photo-btn-delete" onclick="removePhoto(${idx})">✕</button>
                    </div>
                `;
                grid.appendChild(item);
            });
        }

        function movePhoto(idx, direction) {
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= editingImagesList.length) return;
            const temp = editingImagesList[idx];
            editingImagesList[idx] = editingImagesList[newIdx];
            editingImagesList[newIdx] = temp;
            renderEditPhotosGrid();
        }

        function removePhoto(idx) {
            editingImagesList.splice(idx, 1);
            renderEditPhotosGrid();
        }

        function handleEditNewFiles(inputEl) {
            editNewFiles = Array.from(inputEl.files);
            document.getElementById('editUploadStatus').innerText = editNewFiles.length > 0 ? `Выбрано новых файлов: ${editNewFiles.length}` : '';
        }

        async function saveEditedLocation() {
            const editBtn = document.getElementById('editSaveBtn');
            const id = document.getElementById('editLocationId').value;
            const title = document.getElementById('editTitle').value.trim();
            const category = document.getElementById('editCategorySelect').value;
            const address = document.getElementById('editAddress').value.trim();
            const coordsStr = document.getElementById('editCoords').value.trim();
            const description = document.getElementById('editDesc').value.trim();
            const metro = getMetroFromInputs('edit');

            if (!title || !coordsStr) { alert("Заполните обязательно: Название и Координаты!"); return; }

            const coordsParts = coordsStr.split(',').map(s => parseFloat(s.trim()));
            if (coordsParts.length < 2 || isNaN(coordsParts[0]) || isNaN(coordsParts[1])) {
                alert("Неверный формат координат!"); return;
            }

            editBtn.disabled = true;

            if (editNewFiles.length > 0) {
                document.getElementById('editUploadStatus').innerText = "Оптимизация и загрузка новых фото...";
                const uploadedUrls = await uploadImagesToSupabase(editNewFiles, id);
                editingImagesList = [...editingImagesList, ...uploadedUrls];
            }

            const { error } = await supabaseClient.from('Location').update({
                title, category, address, lat: coordsParts[0], lng: coordsParts[1], description, images: editingImagesList, metro
            }).eq('id', id);

            editBtn.disabled = false;

            if (error) {
                alert("Ошибка обновления: " + error.message);
            } else {
                closeEditModal();
                loadLocations();
            }
        }

        function toggleAccordion(element) { element.closest('.category-group').classList.toggle('collapsed'); }

        function selectLocationOnMap(loc, placemark) {
            myMap.setCenter([loc.lat, loc.lng], 15, { duration: 300 }).then(() => placemark.balloon.open());
            if (window.innerWidth <= 768) switchMobileView('map');
        }

        function openLightboxFromLoc(locId, index, event) {
            if (event) event.stopPropagation();
            const loc = allLocations.find(l => l.id === locId);
            if (!loc || !loc.images) return;
            currentGallery = loc.images;
            currentImageIdx = index;
            updateLightboxImage();
            document.getElementById('lightbox').classList.add('active');
        }

        function openLightboxDirect(gallery, index, event) {
            if (event) event.stopPropagation();
            if (!gallery || !gallery.length) return;
            currentGallery = gallery;
            currentImageIdx = index;
            updateLightboxImage();
            document.getElementById('lightbox').classList.add('active');
        }

        function updateLightboxImage() {
            document.getElementById('lightbox-img').src = currentGallery[currentImageIdx];
            document.getElementById('lightbox-counter').innerText = `${currentImageIdx + 1} из ${currentGallery.length}`;
        }

        function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
        function nextImage() { if (!currentGallery.length) return; currentImageIdx = (currentImageIdx + 1) % currentGallery.length; updateLightboxImage(); }
        function prevImage() { if (!currentGallery.length) return; currentImageIdx = (currentImageIdx - 1 + currentGallery.length) % currentGallery.length; updateLightboxImage(); }

        let touchStartX = 0;
        let touchEndX = 0;
        const lightboxEl = document.getElementById('lightbox');
        
        lightboxEl.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightboxEl.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 45) nextImage();
            if (touchEndX > touchStartX + 45) prevImage();
        }, { passive: true });

        function switchMobileView(view) {
            const btnMap = document.getElementById('btn-map-view');
            const btnList = document.getElementById('btn-list-view');
            if (view === 'map') {
                document.body.classList.remove('show-list');
                btnMap.classList.add('active'); btnList.classList.remove('active');
                if (myMap) myMap.container.fitToViewport();
            } else {
                document.body.classList.add('show-list');
                btnList.classList.add('active'); btnMap.classList.remove('active');
            }
        }

        async function deleteLocation(id, event) {
            if (event) event.stopPropagation();
            if (confirm("Удалить эту локацию?")) {
                await supabaseClient.from('Location').delete().eq('id', id);
                loadLocations();
            }
        }

        checkAuth();
    </script>
</body>
