<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f3f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>локации от @dalazareva</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=7370bad5-a627-4414-a1e8-b2023bda7a61&lang=ru_RU"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #f4f3f0;
            color: #1a1a1a;
            -webkit-text-size-adjust: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        #app-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            background: #f4f3f0;
        }

        #sidebar {
            width: 390px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: 2px 0 12px rgba(0,0,0,0.04);
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: max(calc(env(safe-area-inset-top) + 12px), 16px) 16px 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }

        .tg-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 0.88rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .tg-badge-text strong { color: #38bdf8; font-weight: 700; }

        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%;
            padding: 9px 12px 9px 34px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.88rem;
            outline: none;
            background: #f9fafb;
        }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: #9ca3af;
            pointer-events: none;
        }

        #locations-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 90px);
            background: #ffffff;
        }

        .category-group {
            margin-bottom: 12px;
            background: #ffffff;
            border: 1px solid #eef0f2;
            border-radius: 12px;
            overflow: hidden;
        }
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f9fafb;
            user-select: none;
        }
        .category-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex: 1;
        }
        .category-title { font-weight: 600; font-size: 0.92rem; color: #1f2937; }
        .category-count {
            font-size: 0.75rem;
            background: #e5e7eb;
            color: #4b5563;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
        }
        .category-controls { display: flex; align-items: center; gap: 10px; }
        .toggle-visibility-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .chevron {
            font-size: 0.8rem;
            transition: transform 0.2s;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
        }
        .category-group.collapsed .chevron { transform: rotate(-90deg); }
        .category-group.collapsed .category-content { display: none; }
        .category-content { padding: 8px; }

        .location-card {
            background: #ffffff;
            border: 1px solid #f3f4f6;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .location-card.active { border-color: #0f172a; background-color: #f8fafc; }
        .card-title { font-size: 1rem; font-weight: 600; color: #111827; margin-bottom: 8px; line-height: 1.3; }
        .card-address-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; width: 100%; }
        .card-address {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            color: #475569;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
            border: 1px solid #e2e8f0;
            width: 100%;
        }
        
        .card-metro-block { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .metro-badge { display: inline-flex; align-items: center; gap: 5px; background: #ffffff; color: #1e293b; font-size: 0.74rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .metro-icon-svg { width: 14px; height: 11px; flex-shrink: 0; }
        
        .card-actions-row { display: flex; gap: 6px; width: 100%; }
        .copy-btn, .route-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 10px;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #cbd5e1;
        }
        .copy-btn { background: #ffffff; color: #334155; }
        .route-btn { background: #0f172a; border-color: #0f172a; color: #ffffff; }

        .card-desc { font-size: 0.85rem; color: #4b5563; line-height: 1.4; margin-bottom: 10px; white-space: pre-line; }
        .card-photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .card-photo-thumb {
            height: 80px;
            width: auto;
            max-width: 150px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.08);
        }

        #map-container {
            position: absolute;
            top: 0;
            left: 390px;
            right: 0;
            bottom: 0;
            width: calc(100vw - 390px);
            height: 100%;
            z-index: 1;
            background: #f4f3f0;
        }
        #map { width: 100%; height: 100%; }

        .custom-map-pin {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            border: 2px solid #ffffff;
            cursor: pointer;
            user-select: none;
            color: #fff;
            transition: transform 0.2s;
        }
        .custom-map-pin:hover { transform: scale(1.1); }

        .balloon-wrapper { min-width: 210px; max-width: 260px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        .balloon-title { font-size: 0.95rem; font-weight: 700; color: #0f172a; line-height: 1.25; margin-bottom: 8px; }
        .balloon-address-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; width: 100%; }
        .balloon-address { font-size: 0.78rem; color: #475569; background: #f1f5f9; padding: 6px 8px; border-radius: 6px; line-height: 1.35; word-break: break-word; border: 1px solid #e2e8f0; width: 100%; }
        .balloon-metro-block { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .balloon-actions-row { display: flex; gap: 6px; width: 100%; }
        .balloon-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 8px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; text-decoration: none; cursor: pointer; text-align: center; }
        .balloon-copy-btn { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; }
        .balloon-route-btn { background: #0f172a; border: 1px solid #0f172a; color: #ffffff; }
        .balloon-desc { font-size: 0.82rem; color: #334155; line-height: 1.4; margin-top: 8px; margin-bottom: 8px; white-space: pre-line; border-top: 1px solid #f1f5f9; padding-top: 6px; }
        .balloon-photos { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 2px; }
        .balloon-photo-img { height: 65px; width: auto; border-radius: 6px; cursor: pointer; object-fit: cover; border: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; }

        /* ВЕРХНЯЯ ПАНЕЛЬ ФИЛЬТРОВ И МЕТРО */
        .top-cat-filter-bar {
            position: fixed;
            top: max(calc(env(safe-area-inset-top) + 12px), 16px);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 620px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 9999px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            z-index: 1000;
        }

        .metro-filter-select-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .metro-filter-select {
            appearance: none;
            -webkit-appearance: none;
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #e2e8f0;
            padding: 6px 22px 6px 10px;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        .metro-filter-select.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
        .metro-select-arrow {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.65rem;
            pointer-events: none;
            color: #64748b;
        }
        .metro-filter-select.active + .metro-select-arrow { color: #fff; }

        .toggle-all-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 9999px;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .toggle-all-btn.off { background: #e2e8f0; color: #64748b; }

        .cat-chips-scroll { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; width: 100%; }
        .cat-chips-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 9999px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            font-size: 0.78rem;
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }
        .cat-chip.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }
        .cat-chip.disabled { opacity: 0.45; background: #f1f5f9; color: #94a3b8; }

        .lightbox-modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .lightbox-modal.active { display: flex; }
        .lightbox-img { max-width: 92vw; max-height: 85vh; object-fit: contain; border-radius: 8px; }
        .lightbox-close { position: absolute; top: max(calc(env(safe-area-inset-top) + 12px), 20px); right: 20px; color: #ffffff; font-size: 32px; cursor: pointer; padding: 10px; z-index: 10001; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #ffffff; font-size: 36px; cursor: pointer; padding: 16px; opacity: 0.7; z-index: 10001; }
        .lightbox-prev { left: 10px; } .lightbox-next { right: 10px; }
        .lightbox-counter { position: absolute; bottom: max(calc(env(safe-area-inset-bottom) + 16px), 24px); color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 500; }

        .mobile-toggle-bar { display: none; }
        .mobile-search-overlay {
            display: none;
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: calc(env(safe-area-inset-bottom) + 84px);
            z-index: 1001;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 8px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.08);
            align-items: center;
            gap: 8px;
        }
        .mobile-search-overlay.active { display: flex; }
        .mobile-search-input { flex: 1; border: none; background: transparent; font-size: 16px; outline: none; color: #0f172a; }
        .mobile-search-close { background: none; border: none; font-size: 1.1rem; color: #64748b; cursor: pointer; padding: 4px 8px; }

        @media (max-width: 768px) {
            #sidebar { width: 100vw; height: 100%; display: none; }
            
            #map-container {
                position: fixed !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                height: 100dvh !important;
                z-index: 1;
            }
            #map {
                width: 100% !important;
                height: 100% !important;
            }

            .show-list #map-container { display: none !important; }
            .show-list #sidebar { display: flex !important; }
            .show-list .top-cat-filter-bar { display: none !important; }
            
            body:not(.show-list) #sidebar { display: none !important; }
            body:not(.show-list) #map-container { display: block !important; }

            .mobile-toggle-bar {
                display: flex;
                position: fixed;
                bottom: max(calc(env(safe-area-inset-bottom) + 12px), 20px);
                left: 50%;
                transform: translateX(-50%);
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                padding: 4px;
                border-radius: 9999px;
                border: 1px solid rgba(0, 0, 0, 0.08);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
                z-index: 1000;
                gap: 4px;
                align-items: center;
            }
            .toggle-btn {
                padding: 9px 18px;
                border-radius: 9999px;
                border: none;
                background: transparent;
                font-size: 0.85rem;
                font-weight: 600;
                cursor: pointer;
                color: #64748b;
            }
            .toggle-btn.icon-btn { padding: 9px 12px; font-size: 0.95rem; }
            .toggle-btn.active {
                background: #0f172a;
                color: #ffffff;
                box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
            }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div id="sidebar">
            <div class="sidebar-header">
                <a href="https://t.me/dalazareva" target="_blank" rel="noopener" class="tg-badge"[cite: 2]>
                    <span class="tg-badge-text">локации от <strong>@dalazareva</strong></span>[cite: 2]
                    <span class="tg-badge-icon">↗</span>[cite: 2]
                </a>
                <div class="search-container">
                    <span class="search-icon">🔍</span>[cite: 2]
                    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию, адресу, метро..." oninput="handleSearch()">[cite: 2]

            <div id="map"></div>[cite: 2]

                <button id="toggleAllBtn" class="toggle-all-btn" onclick="toggleAllCategories()">👁️ Все</button>[cite: 2]
                
                <div class="metro-filter-select-wrap">
                    <select id="metroFilterSelect" class="metro-filter-select" onchange="handleMetroFilterChange(this.value)">
                        <option value="">🚇 Метро (Все)</option>
                    </select>
                    <span class="metro-select-arrow">▼</span>

    <div id="mobileSearchOverlay" class="mobile-search-overlay">[cite: 2]
        <span>🔍</span>[cite: 2]
        <input type="text" id="mobileSearchInput" class="mobile-search-input" placeholder="Поиск..." oninput="syncMobileSearch(this.value)">[cite: 2]

    </div>

    <div class="mobile-toggle-bar">[cite: 2]
        <button id="btn-search-toggle" class="toggle-btn icon-btn" title="Поиск" onclick="toggleMobileSearch()">🔍</button>[cite: 2]
        <button id="btn-map-view" class="toggle-btn active" onclick="switchMobileView('map')">🗺️ Карта</button>[cite: 2]

    <div id="lightbox" class="lightbox-modal">[cite: 2]
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>[cite: 2]

        <img id="lightbox-img" class="lightbox-img" src="" alt="Фото">[cite: 2]
        <span class="lightbox-nav lightbox-next" onclick="nextImage()">&#10095;</span>[cite: 2]
        <div id="lightbox-counter" class="lightbox-counter"></div>[cite: 2]
    </div>

    <script src="js/supabase.js"></script>[cite: 2]
    <script>
        let myMap;
        let allLocations = [];
        let categoryCollections = {};
        let categoryVisibility = {};
        let allVisibleState = true;
        let currentGallery = [];
        let currentImageIdx = 0;
        let selectedMetroFilter = "";

        const CATEGORY_COLORS = {
            "☕ Кофейни": "#8B4513",
            "🍽️ Заведения (рестораны)": "#059669",
            "🍸 Бары и тусовки": "#7C3AED",
            "📷 Фотостудии": "#EC4899",
            "🚪 Двери и архитектура": "#EA580C",
            "🏞️ Парки и природа": "#16A34A",
            "🏛️ Культура и музеи": "#4F46E5",
            "📸 Инсталокации": "#E11D48",
            "🛍️ Шопинг": "#D97706",
            "🏨 Отели": "#0284C7",
            "📍 Другое": "#0F172A"
        };

        function getCategoryPinColor(category) {
            return CATEGORY_COLORS[category] || "#0F172A";
        }

        function getMetroSvg(color = "#EF161E") {
            return `<svg class="metro-icon-svg" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 18L7.5 0L12 9.5L16.5 0L24 18H19L15 8L12 14.5L9 8L5 18H0Z" fill="${color}"/>
            </svg>`;
        }

        ymaps.ready(initMap);[cite: 2]

        function initMap() {
            myMap = new ymaps.Map("map", {
                center: [55.751574, 37.573856],
                zoom: 12,
                controls: ['zoomControl', 'geolocationControl']
            });[cite: 2]

            loadLocations();[cite: 2]
            window.addEventListener('resize', () => { if (myMap) myMap.container.fitToViewport(); });[cite: 2]
        }

        async function loadLocations() {
            const { data, error } = await supabaseClient.from('Location').select('*');[cite: 2]
            if (error) { console.error("Ошибка загрузки:", error); return; }[cite: 2]
            allLocations = data || [];[cite: 2]
            populateMetroFilterOptions(allLocations);
            renderInterface(allLocations);[cite: 2]
        }

        function populateMetroFilterOptions(locations) {
            const metroSelect = document.getElementById('metroFilterSelect');
            if (!metroSelect) return;

            const stationsMap = new Map();
            locations.forEach(loc => {
                if (loc.metro && Array.isArray(loc.metro)) {
                    loc.metro.forEach(m => {
                        if (m.name) {
                            const count = (stationsMap.get(m.name)?.count || 0) + 1;
                            stationsMap.set(m.name, { count, color: m.color || '#EF161E' });
                        }
                    });
                }
            });

            metroSelect.innerHTML = '<option value="">🚇 Все станции метро</option>';
            const sortedStations = Array.from(stationsMap.keys()).sort((a, b) => a.localeCompare(b));

            sortedStations.forEach(stName => {
                const info = stationsMap.get(stName);
                const opt = document.createElement('option');
                opt.value = stName;
                opt.innerText = `🚇 ${stName} (${info.count})`;
                metroSelect.appendChild(opt);
            });
        }

        function handleMetroFilterChange(val) {
            selectedMetroFilter = val;
            const selectEl = document.getElementById('metroFilterSelect');
            if (val) selectEl.classList.add('active');
            else selectEl.classList.remove('active');
            applyCombinedFilters();
        }

        function handleSearch() {
            applyCombinedFilters();
        }

        function applyCombinedFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = allLocations.filter(loc => {
                const titleMatch = (loc.title || '').toLowerCase().includes(query);
                const addressMatch = (loc.address || '').toLowerCase().includes(query);
                const descMatch = (loc.description || '').toLowerCase().includes(query);
                const metroMatch = loc.metro && Array.isArray(loc.metro) && loc.metro.some(m => (m.name || '').toLowerCase().includes(query));
                const textPass = !query || (titleMatch || addressMatch || descMatch || metroMatch);

                const metroPass = !selectedMetroFilter || (loc.metro && Array.isArray(loc.metro) && loc.metro.some(m => m.name === selectedMetroFilter));

                return textPass && metroPass;
            });

            renderInterface(filtered);

            if (selectedMetroFilter && filtered.length > 0 && myMap) {
                const coordsList = filtered.map(l => [l.lat, l.lng]);
                if (coordsList.length === 1) {
                    myMap.setCenter(coordsList[0], 15, { duration: 300 });
                } else {
                    ymaps.geoQuery(myMap.geoObjects).applyBoundsToMap(myMap, { checkZoomRange: true, duration: 300 });
                }
            }
        }

        function syncMobileSearch(val) {
            document.getElementById('searchInput').value = val;[cite: 2]
            handleSearch();[cite: 2]
        }

        function toggleMobileSearch(forceState) {
            const overlay = document.getElementById('mobileSearchOverlay');[cite: 2]
            const input = document.getElementById('mobileSearchInput');[cite: 2]
            const isCurrentlyActive = overlay.classList.contains('active');[cite: 2]
            const newState = forceState !== undefined ? forceState : !isCurrentlyActive;[cite: 2]

            if (newState) {
                overlay.classList.add('active');[cite: 2]
                input.focus();[cite: 2]
            } else {
                overlay.classList.remove('active');[cite: 2]
                input.blur();[cite: 2]
            }
        }

        function copyAddress(text, event, btnEl) {
            if (event) { event.stopPropagation(); event.preventDefault(); }[cite: 2]
            if (!text) return;[cite: 2]

            const executeCopy = () => {
                if (btnEl) {
                    const origHtml = btnEl.innerHTML;[cite: 2]
                    btnEl.innerHTML = '✓ Скопировано';[cite: 2]
                    btnEl.style.color = '#10b981';[cite: 2]
                    setTimeout(() => { btnEl.innerHTML = origHtml; btnEl.style.color = ''; }, 1500);[cite: 2]
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(executeCopy).catch(() => fallbackCopy(text, executeCopy));[cite: 2]
            } else fallbackCopy(text, executeCopy);[cite: 2]
        }

        function fallbackCopy(text, callback) {
            const textArea = document.createElement("textarea");[cite: 2]
            textArea.value = text; document.body.appendChild(textArea); textArea.select();[cite: 2]
            document.execCommand('copy'); document.body.removeChild(textArea);[cite: 2]
            if (callback) callback();[cite: 2]
        }

        function escapeQuotes(str) { return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }[cite: 2]

        function renderMetroBadges(metroList) {
            if (!metroList || !Array.isArray(metroList) || metroList.length === 0) return '';
            return `<div class="card-metro-block">${metroList.map(m => `
                <span class="metro-badge">
                    ${getMetroSvg(m.color || '#EF161E')}
                    ${m.name} ${m.time ? `<span style="color:#64748b; font-weight:400;">(${m.time} мин)</span>` : ''}
                </span>
            `).join('')}</div>`;
        }

        function renderInterface(locationsToRender) {
            const listEl = document.getElementById('locations-list');[cite: 2]
            listEl.innerHTML = '';[cite: 2]
            const grouped = {};[cite: 2]
            
            locationsToRender.forEach(loc => {
                const cat = loc.category || '📍 Другое';[cite: 2]
                if (!grouped[cat]) grouped[cat] = [];[cite: 2]
                grouped[cat].push(loc);[cite: 2]
            });

            Object.values(categoryCollections).forEach(coll => myMap.geoObjects.remove(coll));[cite: 2]
            categoryCollections = {};[cite: 2]

            if (locationsToRender.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; padding:30px; color:#9ca3af; font-size:0.9rem;">Ничего не найдено 🔍</div>';[cite: 2]
                renderTopCatFilter([]);[cite: 2]
                return;[cite: 2]
            }

            const activeCategoriesList = Object.keys(grouped);[cite: 2]
            renderTopCatFilter(activeCategoriesList);[cite: 2]

            activeCategoriesList.forEach(catName => {
                if (categoryVisibility[catName] === undefined) categoryVisibility[catName] = true;[cite: 2]

                const collection = new ymaps.GeoObjectCollection({}, { visible: categoryVisibility[catName] });[cite: 2]
                categoryCollections[catName] = collection;[cite: 2]
                myMap.geoObjects.add(collection);[cite: 2]

                const groupEl = document.createElement('div');[cite: 2]
                groupEl.className = 'category-group';[cite: 2]
                const isVisible = categoryVisibility[catName];[cite: 2]
                
                groupEl.innerHTML = `
                    <div class="category-header">
                        <div class="category-title-wrap" onclick="toggleAccordion(this)">
                            <span class="category-title">${catName}</span>
                            <span class="category-count">${grouped[catName].length}</span>
                        </div>
                        <div class="category-controls">
                            <button id="pub-cat-icon-${encodeURIComponent(catName)}" class="toggle-visibility-btn" onclick="toggleCategoryMap('${catName}', this, event)">
                                ${isVisible ? '👁️' : '🙈'}
                            </button>
                            <span class="chevron" onclick="toggleAccordion(this)">▼</span>
                        </div>
                    </div>
                    <div class="category-content"></div>
                `;[cite: 2]

                const contentEl = groupEl.querySelector('.category-content');[cite: 2]

                grouped[catName].forEach(loc => {
                    const categoryIcon = loc.category ? loc.category.split(' ')[0] : '📍';[cite: 2]
                    const pinColor = getCategoryPinColor(loc.category);

                    const layout = ymaps.templateLayoutFactory.createClass(
                        `<div class="custom-map-pin" style="background: ${pinColor};"><span>${categoryIcon}</span></div>`
                    );

                    const placemark = new ymaps.Placemark([loc.lat, loc.lng], {
                        hintContent: loc.title,
                        balloonContent: createBalloonHTML(loc)
                    }, {
                        iconLayout: layout,
                        iconOffset: [-19, -19],
                        iconShape: { type: 'Circle', coordinates: [19, 19], radius: 19 },
                        cursor: 'pointer'
                    });[cite: 2]

                    placemark.events.add('click', () => highlightLocationCard(loc.id));[cite: 2]
                    collection.add(placemark);[cite: 2]

                    const cardEl = document.createElement('div');[cite: 2]
                    cardEl.className = 'location-card'; cardEl.id = `card-${loc.id}`;[cite: 2]
                    cardEl.onclick = (e) => {
                        if (!e.target.classList.contains('card-photo-thumb') && !e.target.classList.contains('copy-btn') && !e.target.classList.contains('route-btn')) {[cite: 2]
                            selectLocationOnMap(loc, placemark);[cite: 2]
                        }
                    };

                    let photosHtml = '';[cite: 2]
                    if (loc.images && Array.isArray(loc.images) && loc.images.length > 0) {[cite: 2]
                        photosHtml = `<div class="card-photos">
                            ${loc.images.map((imgUrl, index) => `<img src="${imgUrl}" class="card-photo-thumb" onclick="openLightboxByUrl('${loc.id}', ${index}, event)">`).join('')}
                        </div>`;[cite: 2]
                    }

                    const routeUrl = `https://yandex.ru/maps/?rtext=~${loc.lat},${loc.lng}`;[cite: 2]
                    const safeAddr = escapeQuotes(loc.address);[cite: 2]

                    cardEl.innerHTML = `
                        <div class="card-title">${loc.title}</div>
                        <div class="card-address-block">
                            ${loc.address ? `<div class="card-address">📍 ${loc.address}</div>` : ''}
                            <div class="card-actions-row">
                                ${loc.address ? `<button class="copy-btn" onclick="copyAddress('${safeAddr}', event, this)">📋 Копировать</button>` : ''}
                                <a href="${routeUrl}" target="_blank" rel="noopener" class="route-btn" onclick="event.stopPropagation();">🧭 Маршрут</a>
                            </div>
                        </div>
                        ${renderMetroBadges(loc.metro)}
                        ${loc.description ? `<div class="card-desc">${loc.description}</div>` : ''}
                        ${photosHtml}
                    `;[cite: 2]
                    contentEl.appendChild(cardEl);[cite: 2]
                });
                listEl.appendChild(groupEl);[cite: 2]
            });
        }

        function createBalloonHTML(loc) {
            let photosHtml = '';[cite: 2]
            if (loc.images && Array.isArray(loc.images) && loc.images.length > 0) {[cite: 2]
                photosHtml = `<div class="balloon-photos">
                    ${loc.images.map((img, idx) => `<img src="${img}" class="balloon-photo-img" onclick="openLightboxByUrl('${loc.id}', ${idx}, event)">`).join('')}
                </div>`;[cite: 2]
            }
            const routeUrl = `https://yandex.ru/maps/?rtext=~${loc.lat},${loc.lng}`;[cite: 2]
            const safeAddr = escapeQuotes(loc.address);[cite: 2]

            let metroHtml = '';
            if (loc.metro && Array.isArray(loc.metro) && loc.metro.length > 0) {
                metroHtml = `<div class="balloon-metro-block">${loc.metro.map(m => `
                    <span class="metro-badge">
                        ${getMetroSvg(m.color || '#EF161E')}
                        ${m.name} ${m.time ? `<span style="color:#64748b; font-weight:400;">(${m.time} мин)</span>` : ''}
                    </span>
                `).join('')}</div>`;
            }

            return `
                <div class="balloon-wrapper">
                    <div class="balloon-title">${loc.title}</div>
                    <div class="balloon-address-block">
                        ${loc.address ? `<div class="balloon-address">📍 ${loc.address}</div>` : ''}
                        <div class="balloon-actions-row">
                            ${loc.address ? `<button class="balloon-btn balloon-copy-btn" onclick="copyAddress('${safeAddr}', event, this)">📋 Копировать</button>` : ''}
                            <a href="${routeUrl}" target="_blank" rel="noopener" class="balloon-btn balloon-route-btn">🧭 Маршрут</a>
                        </div>
                    </div>
                    ${metroHtml}
                    ${loc.description ? `<div class="balloon-desc">${loc.description}</div>` : ''}
                    ${photosHtml}
                </div>
            `;[cite: 2]
        }

        function renderTopCatFilter(categories) {
            const container = document.getElementById('catChipsScroll');[cite: 2]
            container.innerHTML = '';[cite: 2]
            if (!categories || categories.length === 0) return;[cite: 2]

            categories.forEach(catName => {
                const isVis = categoryVisibility[catName] !== false;[cite: 2]
                const chip = document.createElement('div');[cite: 2]
                chip.className = `cat-chip ${isVis ? 'active' : 'disabled'}`;[cite: 2]
                chip.innerHTML = `<span>${catName}</span>`;[cite: 2]
                chip.onclick = () => {
                    categoryVisibility[catName] = !categoryVisibility[catName];[cite: 2]
                    const nextState = categoryVisibility[catName];[cite: 2]
                    if (categoryCollections[catName]) categoryCollections[catName].options.set('visible', nextState);[cite: 2]
                    
                    if (nextState) { chip.classList.remove('disabled'); chip.classList.add('active'); }[cite: 2]
                    else { chip.classList.remove('active'); chip.classList.add('disabled'); }[cite: 2]
                    
                    const listIcon = document.getElementById(`pub-cat-icon-${encodeURIComponent(catName)}`);
                    if (listIcon) listIcon.innerText = nextState ? '👁️' : '🙈';

                    updateToggleAllBtnState();[cite: 2]
                };
                container.appendChild(chip);[cite: 2]
            });
            updateToggleAllBtnState();[cite: 2]
        }

        function toggleAllCategories() {
            allVisibleState = !allVisibleState;[cite: 2]
            Object.keys(categoryCollections).forEach(catName => {
                categoryVisibility[catName] = allVisibleState;[cite: 2]
                if (categoryCollections[catName]) categoryCollections[catName].options.set('visible', allVisibleState);[cite: 2]

                const listIcon = document.getElementById(`pub-cat-icon-${encodeURIComponent(catName)}`);
                if (listIcon) listIcon.innerText = allVisibleState ? '👁️' : '🙈';
            });

            document.querySelectorAll('#catChipsScroll .cat-chip').forEach(chip => {
                if (allVisibleState) { chip.classList.remove('disabled'); chip.classList.add('active'); }[cite: 2]
                else { chip.classList.remove('active'); chip.classList.add('disabled'); }[cite: 2]
            });
            updateToggleAllBtnState();[cite: 2]
        }

        function updateToggleAllBtnState() {
            const toggleBtn = document.getElementById('toggleAllBtn');[cite: 2]
            const hasActive = Object.values(categoryVisibility).some(v => v === true);[cite: 2]
            if (hasActive) { allVisibleState = true; toggleBtn.classList.remove('off'); toggleBtn.innerText = '👁️ Все'; }[cite: 2]
            else { allVisibleState = false; toggleBtn.classList.add('off'); toggleBtn.innerText = '🙈 Все'; }[cite: 2]
        }

        function toggleCategoryMap(catName, btnEl, event) {
            if (event) { event.stopPropagation(); event.preventDefault(); }[cite: 2]
            categoryVisibility[catName] = !categoryVisibility[catName];[cite: 2]
            const isVis = categoryVisibility[catName];[cite: 2]
            
            if (categoryCollections[catName]) categoryCollections[catName].options.set('visible', isVis);[cite: 2]
            
            const listIcon = document.getElementById(`pub-cat-icon-${encodeURIComponent(catName)}`);
            if (listIcon) listIcon.innerText = isVis ? '👁️' : '🙈';

            renderTopCatFilter(Object.keys(categoryCollections));[cite: 2]
        }

        function toggleAccordion(element) { element.closest('.category-group').classList.toggle('collapsed'); }[cite: 2]

        function selectLocationOnMap(loc, placemark) {
            myMap.setCenter([loc.lat, loc.lng], 15, { duration: 300 }).then(() => placemark.balloon.open());[cite: 2]
            document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));[cite: 2]
            const card = document.getElementById(`card-${loc.id}`);[cite: 2]
            if (card) card.classList.add('active');[cite: 2]
            if (window.innerWidth <= 768) switchMobileView('map');[cite: 2]
        }

        function highlightLocationCard(locId) {
            document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));[cite: 2]
            const card = document.getElementById(`card-${locId}`);[cite: 2]
            if (card) {
                card.classList.add('active');[cite: 2]
                const group = card.closest('.category-group');[cite: 2]
                if (group) group.classList.remove('collapsed');[cite: 2]
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });[cite: 2]
            }
        }

        function openLightboxByUrl(locId, index, event) {
            if (event) event.stopPropagation();[cite: 2]
            const loc = allLocations.find(l => l.id === locId);[cite: 2]
            if (!loc || !loc.images) return;[cite: 2]
            currentGallery = loc.images; currentImageIdx = index;[cite: 2]
            updateLightboxImage();[cite: 2]
            document.getElementById('lightbox').classList.add('active');[cite: 2]
        }

        function updateLightboxImage() {
            document.getElementById('lightbox-img').src = currentGallery[currentImageIdx];[cite: 2]
            document.getElementById('lightbox-counter').innerText = `${currentImageIdx + 1} из ${currentGallery.length}`;[cite: 2]
        }

        function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }[cite: 2]
        function nextImage() { if (!currentGallery.length) return; currentImageIdx = (currentImageIdx + 1) % currentGallery.length; updateLightboxImage(); }[cite: 2]
        function prevImage() { if (!currentGallery.length) return; currentImageIdx = (currentImageIdx - 1 + currentGallery.length) % currentGallery.length; updateLightboxImage(); }[cite: 2]

        function switchMobileView(view) {
            const btnMap = document.getElementById('btn-map-view');[cite: 2]
            const btnList = document.getElementById('btn-list-view');[cite: 2]
            if (view === 'map') {
                document.body.classList.remove('show-list');[cite: 2]
                btnMap.classList.add('active'); btnList.classList.remove('active');[cite: 2]
                setTimeout(() => { if (myMap) myMap.container.fitToViewport(); }, 50);
            } else {
                document.body.classList.add('show-list');[cite: 2]
                btnList.classList.add('active'); btnMap.classList.remove('active');[cite: 2]
                toggleMobileSearch(false);[cite: 2]
            }
        }
    </script>
