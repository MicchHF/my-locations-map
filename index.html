<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локации от @dalazareva</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=17e91f7c-3356-4174-9a25-5ac34ba55d46&lang=ru_RU"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="sidebar">
        <div class="header"><h1>@dalazareva</h1></div>
        <div id="list-section">
            <h2>Сохраненные локации</h2>
            <div id="locations-list">Загрузка...</div>
        </div>
    </div>
    <div id="map"></div>

    <!-- Мобильный переключатель -->
    <div class="mobile-toggle-bar">
        <button id="btn-map-view" class="toggle-btn active" onclick="switchMobileView('map')">🗺️ Карта</button>
        <button id="btn-list-view" class="toggle-btn" onclick="switchMobileView('list')">📋 Список</button>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        let myMap;

        ymaps.ready(async () => {
            myMap = new ymaps.Map("map", { center: [55.751574, 37.573856], zoom: 10 });

            const { data: locations, error } = await supabaseClient.from('Location').select('*');
            const listEl = document.getElementById('locations-list');
            
            if (error || !locations.length) {
                listEl.innerHTML = '<p>Нет доступных локаций.</p>';
                return;
            }

            listEl.innerHTML = '';
            locations.forEach(loc => {
                const categoryIcon = loc.category || '📍';
                let photosHtml = (loc.images || []).map(url => `<img src="${url}">`).join('');
                let balloonContent = `
                    <div class="balloon-content">
                        <h3>${categoryIcon} ${loc.title}</h3>
                        ${loc.address ? `<p style="font-size:0.8rem; color:#666; margin:4px 0;">📍 ${loc.address}</p>` : ''}
                        <p style="font-size:0.85rem; margin:6px 0;">${loc.description || ''}</p>
                        ${photosHtml ? `<div class="balloon-photos">${photosHtml}</div>` : ''}
                        <a href="https://yandex.ru/maps/?rtext=~${loc.lat},${loc.lng}" target="_blank" class="route-btn">Маршрут ↗</a>
                    </div>`;

                const layout = ymaps.templateLayoutFactory.createClass(
                    `<div class="custom-map-pin"><span>${categoryIcon}</span></div>`
                );

                const placemark = new ymaps.Placemark([loc.lat, loc.lng], { balloonContent }, {
                    iconLayout: layout, iconOffset: [-18, -36]
                });

                myMap.geoObjects.add(placemark);

                const item = document.createElement('div');
                item.style.cssText = 'padding: 12px; border-bottom: 1px solid #eee; cursor: pointer;';
                item.innerHTML = `<strong>${categoryIcon} ${loc.title}</strong><br>` +
                                 `${loc.address ? `<small style="color:#71717a;">📍 ${loc.address}</small><br>` : ''}` +
                                 `<small style="color:#3f3f46;">${loc.description || ''}</small>`;
                item.onclick = () => {
                    myMap.setCenter([loc.lat, loc.lng], 15);
                    placemark.balloon.open();
                    switchMobileView('map');
                };
                listEl.appendChild(item);
            });
        });

        function switchMobileView(view) {
            const btnMap = document.getElementById('btn-map-view');
            const btnList = document.getElementById('btn-list-view');
            if (view === 'map') {
                document.body.classList.remove('show-list');
                btnMap.classList.add('active');
                btnList.classList.remove('active');
                if (myMap) myMap.container.fitToViewport();
            } else {
                document.body.classList.add('show-list');
                btnList.classList.add('active');
                btnMap.classList.remove('active');
            }
        }
    </script>
</body>
</html>
