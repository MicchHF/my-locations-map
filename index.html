<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f3f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>@dalazareva локации📍</title>
    
    <!-- Иконка сайта и веб-приложения -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=7370bad5-a627-4414-a1e8-b2023bda7a61&lang=ru_RU"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #f4f3f0;
            color: #1a1a1a;
            -webkit-text-size-adjust: 100%;
            overflow: hidden;
            position: fixed;
            inset: 0;
        }

        #app-wrapper {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            background: #f4f3f0;
        }

        /* ЭКРАН БЛОКИРОВКИ ДО ВХОДА */
        .auth-gate-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-gate-card {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .auth-gate-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2);
        }
        .auth-gate-title { font-size: 1.25rem; font-weight: 800; color: #0f172a; line-height: 1.3; }
        .auth-gate-desc { font-size: 0.88rem; color: #64748b; line-height: 1.45; }
        
        .tg-direct-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .tg-direct-btn:active { transform: scale(0.98); }

        #sidebar {
            width: 390px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: 2px 0 12px rgba(0,0,0,0.04);
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: max(calc(env(safe-area-inset-top) + 12px), 16px) 16px 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }

        /* ШАПКА: ПРОФИЛЬ + КНОПКА КАНАЛА */
        .header-top-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tg-badge {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }
        .tg-badge:active { transform: scale(0.98); }

        .channel-link-btn {
            width: 48px;
            background: #0284c7;
            color: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
            flex-shrink: 0;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .channel-link-btn:hover { background: #0369a1; }
        .channel-link-btn:active { transform: scale(0.95); }

        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.88rem;
            outline: none;
            background: #f9fafb;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.88rem;
            color: #9ca3af;
            pointer-events: none;
        }

        #locations-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 90px);
            background: #ffffff;
        }

        .category-group {
            margin-bottom: 12px;
            background: #ffffff;
            border: 1px solid #eef0f2;
            border-radius: 12px;
            overflow: hidden;
        }
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f9fafb;
            user-select: none;
        }
        .category-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex: 1;
        }
        .category-title { font-weight: 600; font-size: 0.92rem; color: #1f2937; }
        .category-count {
            font-size: 0.75rem;
            background: #e5e7eb;
            color: #4b5563;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
        }
        .category-controls { display: flex; align-items: center; gap: 10px; }
        .toggle-visibility-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .chevron {
            font-size: 0.8rem;
            transition: transform 0.2s;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
        }
        .category-group.collapsed .chevron { transform: rotate(-90deg); }
        .category-group.collapsed .category-content { display: none; }
        .category-content { padding: 8px; }

        .location-card {
            background: #ffffff;
            border: 1px solid #f3f4f6;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .location-card.active { border-color: #0f172a; background-color: #f8fafc; }
        .card-title { font-size: 1rem; font-weight: 600; color: #111827; margin-bottom: 8px; line-height: 1.3; }
        .card-address-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; width: 100%; }
        .card-address {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            color: #475569;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
            border: 1px solid #e2e8f0;
            width: 100%;
        }
        
        .card-metro-block { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .metro-badge { display: inline-flex; align-items: center; gap: 5px; background: #ffffff; color: #1e293b; font-size: 0.74rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .metro-icon-svg { width: 14px; height: 11px; flex-shrink: 0; }
        
        .card-actions-row { display: flex; gap: 6px; width: 100%; }
        .copy-btn, .route-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 10px;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #cbd5e1;
        }
        .copy-btn { background: #ffffff; color: #334155; }
        .route-btn { background: #0f172a; border-color: #0f172a; color: #ffffff; }

        .card-desc { font-size: 0.85rem; color: #4b5563; line-height: 1.4; margin-bottom: 10px; white-space: pre-line; }
        .card-photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 6px; }
        .card-photo-thumb {
            height: 80px;
            width: auto;
            max-width: 150px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.08);
            transition: transform 0.15s ease;
        }
        .card-photo-thumb:hover { transform: scale(1.02); }

        #map-container {
            position: absolute;
            inset: 0 0 0 390px;
            width: calc(100vw - 390px);
            height: 100%;
            z-index: 1;
            background: #f4f3f0;
        }
        #map { width: 100%; height: 100%; background: #f4f3f0; }

        .custom-map-pin {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            border: 2px solid #ffffff;
            cursor: pointer;
            user-select: none;
            color: #fff;
            transition: transform 0.2s;
        }
        .custom-map-pin:hover { transform: scale(1.1); }

        .balloon-wrapper { min-width: 210px; max-width: 260px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        .balloon-title { font-size: 0.95rem; font-weight: 700; color: #0f172a; line-height: 1.25; margin-bottom: 8px; }
        .balloon-address-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; width: 100%; }
        .balloon-address { font-size: 0.78rem; color: #475569; background: #f1f5f9; padding: 6px 8px; border-radius: 6px; line-height: 1.35; word-break: break-word; border: 1px solid #e2e8f0; width: 100%; }
        .balloon-metro-block { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .balloon-actions-row { display: flex; gap: 6px; width: 100%; }
        .balloon-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 8px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; text-decoration: none; cursor: pointer; text-align: center; }
        .balloon-copy-btn { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; }
        .balloon-route-btn { background: #0f172a; border: 1px solid #0f172a; color: #ffffff; }
        .balloon-desc { font-size: 0.82rem; color: #334155; line-height: 1.4; margin-top: 8px; margin-bottom: 8px; white-space: pre-line; border-top: 1px solid #f1f5f9; padding-top: 6px; }
        .balloon-photos { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 2px; }
        .balloon-photo-img { height: 65px; width: auto; border-radius: 6px; cursor: pointer; object-fit: cover; border: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; }

        /* ВЕРХНЯЯ СТРОКА КАТЕГОРИЙ */
        .top-cat-filter-bar {
            position: fixed;
            top: max(calc(env(safe-area-inset-top) + 12px), 16px);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 620px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 9999px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            z-index: 1000;
        }

        .toggle-all-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 9999px;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .toggle-all-btn.off { background: #e2e8f0; color: #64748b; }

        .cat-chips-scroll { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; width: 100%; }
        .cat-chips-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 9999px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            font-size: 0.78rem;
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }
        .cat-chip.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }
        .cat-chip.disabled { opacity: 0.45; background: #f1f5f9; color: #94a3b8; }

        /* ПЛАВАЮЩАЯ КНОПКА МЕТРО */
        .metro-floating-btn {
            position: fixed;
            top: max(calc(env(safe-area-inset-top) + 72px), 76px);
            left: max(calc(env(safe-area-inset-left) + 16px), 16px);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 9999px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            color: #0f172a;
            transition: all 0.2s ease;
        }
        .metro-floating-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
        .metro-floating-btn .metro-badge-dot {
            width: 9px; height: 9px; border-radius: 50%; display: none;
        }
        .metro-floating-btn.active .metro-badge-dot { display: inline-block; }

        /* БОКОВОЕ МЕНЮ МЕТРО */
        .metro-sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: flex-start;
            justify-content: flex-start;
        }
        .metro-sidebar-overlay.active { display: flex; }
        
        .metro-sidebar-drawer {
            background: #ffffff;
            width: 360px;
            max-width: 90vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 25px rgba(0,0,0,0.15);
            padding-top: max(calc(env(safe-area-inset-top) + 10px), 16px);
            padding-bottom: max(calc(env(safe-area-inset-bottom) + 10px), 16px);
            animation: slideIn 0.25s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        .metro-drawer-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .metro-drawer-title { font-weight: 700; font-size: 1.05rem; color: #0f172a; }
        .metro-drawer-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #64748b; padding: 4px; }
        
        .metro-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .metro-section-label { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

        .metro-lines-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px;
            background: #f8fafc;
        }
        .metro-line-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            color: #1e293b;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.15s ease;
        }
        .metro-line-item:hover, .metro-line-item.selected {
            border-color: #0f172a;
            background: #f1f5f9;
        }
        .metro-line-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .metro-line-color-dot.mck-ring {
            border: 2.5px solid #DF4842 !important;
            background: #ffffff !important;
        }

        .metro-stations-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px;
            background: #ffffff;
        }
        .metro-station-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .metro-station-item:hover, .metro-station-item.active {
            background: #0f172a;
            color: #ffffff;
            font-weight: 600;
        }
        .metro-station-count {
            font-size: 0.72rem;
            background: rgba(0,0,0,0.06);
            padding: 2px 6px;
            border-radius: 999px;
        }
        .metro-station-item.active .metro-station-count {
            background: rgba(255,255,255,0.2);
            color: #ffffff;
        }

        .metro-reset-btn {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
        }

        /* LIGHTBOX */
        .lightbox-modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            touch-action: none;
        }
        .lightbox-modal.active { display: flex; }
        .lightbox-img { max-width: 92vw; max-height: 85vh; object-fit: contain; border-radius: 8px; user-select: none; }
        .lightbox-close { position: absolute; top: max(calc(env(safe-area-inset-top) + 12px), 20px); right: 20px; color: #ffffff; font-size: 32px; cursor: pointer; padding: 10px; z-index: 10001; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #ffffff; font-size: 36px; cursor: pointer; padding: 16px; opacity: 0.7; z-index: 10001; user-select: none; }
        .lightbox-prev { left: 10px; } .lightbox-next { right: 10px; }
        .lightbox-counter { position: absolute; bottom: max(calc(env(safe-area-inset-bottom) + 16px), 24px); color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 500; }

        .mobile-toggle-bar { display: none; }
        .mobile-search-overlay {
            display: none;
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: calc(env(safe-area-inset-bottom) + 84px);
            z-index: 1001;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 8px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.08);
            align-items: center;
            gap: 8px;
        }
        .mobile-search-overlay.active { display: flex; }
        .mobile-search-input { flex: 1; border: none; background: transparent; font-size: 16px; outline: none; color: #0f172a; padding-left: 4px; }
        .mobile-search-close { background: none; border: none; font-size: 1.1rem; color: #64748b; cursor: pointer; padding: 4px 8px; }

        @media (max-width: 768px) {
            #sidebar { width: 100vw; height: 100%; display: none; }
            
            #map-container {
                position: fixed !important;
                inset: 0 !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                width: 100vw !important;
                height: 100% !important;
                height: 100dvh !important;
                z-index: 1;
            }
            #map {
                width: 100% !important;
                height: 100% !important;
            }

            .show-list #map-container { display: none !important; }
            .show-list #sidebar { display: flex !important; }
            .show-list .top-cat-filter-bar { display: none !important; }
            .show-list .metro-floating-btn { display: none !important; }
            
            body:not(.show-list) #sidebar { display: none !important; }

        // Авторизация пользователя через Telegram
        async function checkAuthAndInit() {
            let tgUser = null;

            if (isInsideTelegram) {
                tgUser = window.Telegram.WebApp.initDataUnsafe.user;
            }

            if (tgUser && tgUser.id) {
                const tgId = tgUser.id;
                try {
                    let { data: profile } = await supabaseClient
                        .from('app_users')
                        .select('*')
                        .eq('telegram_id', tgId)
                        .maybeSingle();

                    if (!profile) {
                        const newProfile = {
                            telegram_id: tgId,
                            username: tgUser.username || '',
                            first_name: tgUser.first_name || 'Пользователь',
                            plan: 'free',
                            expires_at: null
                        };

                        const { data: createdUser } = await supabaseClient
                            .from('app_users')
                            .insert([newProfile])
                            .select()
                            .single();

                        profile = createdUser || newProfile;
                    }

                    currentUser = profile;
                } catch (e) {
                    console.error("Ошибка Supabase auth:", e);
                }

                // Скрываем экран блокировки и запускаем карту
                document.getElementById('authGate').style.display = 'none';
                renderUserPlanBadge();
                initMap();
            } else {
                // Если открыто вне Telegram -> блокируем интерфейс и предлагаем войти
                document.getElementById('authGate').style.display = 'flex';
            }
        }

                window.Telegram.WebApp.openTelegramLink(botUrl);
            } else {
                window.open(botUrl, "_blank");
            }
        }

        function renderUserPlanBadge() {
            const nameEl = document.getElementById('userDisplayName');
            const planEl = document.getElementById('userPlanLabel');
            if (!nameEl || !planEl) return;

            let userTag = "";
            if (currentUser.username) {
                userTag = `@${currentUser.username}`;
            } else if (currentUser.first_name) {
                userTag = currentUser.first_name;
            } else {
                userTag = "Пользователь";
            }

            nameEl.innerText = `👤 ${userTag}`;

            let planLabel = "Тариф: FREE";
            let planColor = "#38bdf8";

            if (currentUser.plan === 'premium' || currentUser.plan === 'vip') {
                planLabel = "Тариф: PREMIUM ✨";
                planColor = "#fbbf24";
            } else if (currentUser.plan === 'trial') {
                planLabel = "Тариф: ТЕСТ 🎁";
                planColor = "#34d399";
            }

            planEl.innerText = planLabel;
            planEl.style.color = planColor;
        }

                    zoom: 12,
                    controls: ['zoomControl', 'geolocationControl']
                }, {
                    autoFitToViewport: 'always'
                });

                myMap.events.add('click', function () {
                    if (activeBalloonPlacemark) {
                        activeBalloonPlacemark.balloon.close();
                        activeBalloonPlacemark = null;
                    }
                });

                loadLocations();
                window.addEventListener('resize', () => { if (myMap) myMap.container.fitToViewport(); });
            });
        }

        async function loadLocations() {
            const { data, error } = await supabaseClient.from('Location').select('*');
            if (error) { console.error("Ошибка загрузки:", error); return; }
            allLocations = data || [];
            initMetroDrawer();
            renderInterface(allLocations);
        }

        function openMetroDrawer() {
            document.getElementById('metroSidebarOverlay').classList.add('active');
        }

        function closeMetroDrawer(e) {
            if (e && e.target !== e.currentTarget && !e.target.classList.contains('metro-drawer-close')) return;
            document.getElementById('metroSidebarOverlay').classList.remove('active');
        }

        function initMetroDrawer() {
            const linesGrid = document.getElementById('metroLinesGrid');
            linesGrid.innerHTML = `
                <div class="metro-line-item ${!selectedLineName ? 'selected' : ''}" onclick="selectMetroLine('')">
                    <span class="metro-line-color-dot" style="background:#0f172a;"></span>
                    <span>Все ветки метро</span>
                </div>
            `;

            MOSCOW_METRO_DATA.forEach(line => {
                const item = document.createElement('div');
                item.className = `metro-line-item ${selectedLineName === line.name ? 'selected' : ''}`;
                const dotClass = line.isRing ? 'metro-line-color-dot mck-ring' : 'metro-line-color-dot';
                item.innerHTML = `
                    <span class="${dotClass}" style="${!line.isRing ? `background:${line.color};` : ''}"></span>
                    <span>${line.name}</span>
                `;
                item.onclick = () => selectMetroLine(line.name);
                linesGrid.appendChild(item);
            });

            renderMetroStationsList();
        }

        function selectMetroLine(lineName) {
            selectedLineName = lineName;
            initMetroDrawer();
        }

        function renderMetroStationsList() {
            const listEl = document.getElementById('metroStationsList');
            listEl.innerHTML = '';

            let stations = [];
            if (selectedLineName) {
                const found = MOSCOW_METRO_DATA.find(l => l.name === selectedLineName);
                if (found) stations = found.stations;
            } else {
                const set = new Set();
                MOSCOW_METRO_DATA.forEach(l => l.stations.forEach(s => set.add(s)));
                stations = Array.from(set).sort((a, b) => a.localeCompare(b));
            }

            stations.forEach(stName => {
                let count = 0;
                allLocations.forEach(loc => {
                    if (loc.metro && Array.isArray(loc.metro) && loc.metro.some(m => m.name === stName)) count++;
                });

                const item = document.createElement('div');
                item.className = `metro-station-item ${selectedMetroFilter === stName ? 'active' : ''}`;
                item.innerHTML = `
                    <span>${stName}</span>
                    ${count > 0 ? `<span class="metro-station-count">${count}</span>` : ''}
                `;
                item.onclick = () => selectMetroStation(stName);
                listEl.appendChild(item);
            });
        }

        function selectMetroStation(stationName) {
            selectedMetroFilter = stationName;
            updateMetroButtonUI();
            applyCombinedFilters();
            renderMetroStationsList();
            closeMetroDrawer();
        }

        function resetMetroFilter() {
            selectedMetroFilter = "";
            selectedLineName = "";
            initMetroDrawer();
            updateMetroButtonUI();
            applyCombinedFilters();
            closeMetroDrawer();
        }

        function updateMetroButtonUI() {
            const btn = document.getElementById('metroFloatingBtn');
            const label = document.getElementById('metroBtnLabel');
            const dot = document.getElementById('activeMetroDot');

            if (selectedMetroFilter) {
                btn.classList.add('active');
                label.innerText = `🚇 ${selectedMetroFilter}`;
                
                let foundColor = "#EF161E";
                let isMck = false;
                for (let line of MOSCOW_METRO_DATA) {
                    if (line.stations.includes(selectedMetroFilter)) {
                        foundColor = line.color;
                        isMck = !!line.isRing;
                        break;
                    }
                }
                if (isMck) {
                    dot.className = 'metro-badge-dot mck-ring';
                    dot.style.background = '#ffffff';
                } else {
                    dot.className = 'metro-badge-dot';
                    dot.style.background = foundColor;
                }
            } else {
                btn.classList.remove('active');
                label.innerText = "🚇 Метро";
            }
        }

        function handleSearch() {
            applyCombinedFilters();
        }

        function applyCombinedFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = allLocations.filter(loc => {
                const titleMatch = (loc.title || '').toLowerCase().includes(query);
                const addressMatch = (loc.address || '').toLowerCase().includes(query);
                const descMatch = (loc.description || '').toLowerCase().includes(query);
                const metroMatch = loc.metro && Array.isArray(loc.metro) && loc.metro.some(m => (m.name || '').toLowerCase().includes(query));
                const textPass = !query || (titleMatch || addressMatch || descMatch || metroMatch);

                const metroPass = !selectedMetroFilter || (loc.metro && Array.isArray(loc.metro) && loc.metro.some(m => m.name === selectedMetroFilter));

                return textPass && metroPass;
            });

            renderInterface(filtered);

            if (selectedMetroFilter && filtered.length > 0 && myMap) {
                const coordsList = filtered.map(l => [l.lat, l.lng]);
                if (coordsList.length === 1) {
                    myMap.setCenter(coordsList[0], 15, { duration: 300 });
                } else {
                    ymaps.geoQuery(myMap.geoObjects).applyBoundsToMap(myMap, { checkZoomRange: true, duration: 300 });
                }
            }
        }

        function syncMobileSearch(val) {
            document.getElementById('searchInput').value = val;
            handleSearch();
        }

        function toggleMobileSearch(forceState) {
            const overlay = document.getElementById('mobileSearchOverlay');
            const input = document.getElementById('mobileSearchInput');
            const isCurrentlyActive = overlay.classList.contains('active');
            const newState = forceState !== undefined ? forceState : !isCurrentlyActive;

            if (newState) {
                overlay.classList.add('active');
                input.focus();
            } else {
                overlay.classList.remove('active');
                input.blur();
            }
        }

        function copyAddress(text, event, btnEl) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            if (!text) return;

            const executeCopy = () => {
                if (btnEl) {
                    const origHtml = btnEl.innerHTML;
                    btnEl.innerHTML = '✓ Скопировано';
                    btnEl.style.color = '#10b981';
                    setTimeout(() => { btnEl.innerHTML = origHtml; btnEl.style.color = ''; }, 1500);
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(executeCopy).catch(() => fallbackCopy(text, executeCopy));
            } else fallbackCopy(text, executeCopy);
        }

        function fallbackCopy(text, callback) {
            const textArea = document.createElement("textarea");
            textArea.value = text; document.body.appendChild(textArea); textArea.select();
            document.execCommand('copy'); document.body.removeChild(textArea);
            if (callback) callback();
        }

        function escapeQuotes(str) { return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

        function renderMetroBadges(metroList) {
            if (!metroList || !Array.isArray(metroList) || metroList.length === 0) return '';
            return `<div class="card-metro-block">${metroList.map(m => {
                const isMck = (m.name && m.name.includes('МЦК')) || m.color === '#DF4842';
                return `
                <span class="metro-badge">
                    ${getMetroSvg(m.color || '#EF161E', isMck)}
                    ${m.name} ${m.time ? `<span style="color:#64748b; font-weight:400;">(${m.time} мин)</span>` : ''}
                </span>
            `}).join('')}</div>`;
        }

        function renderInterface(locationsToRender) {
            const listEl = document.getElementById('locations-list');
            listEl.innerHTML = '';
            const grouped = {};
            
            locationsToRender.forEach(loc => {
                const cat = loc.category || '📍 Другое';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(loc);
            });

            Object.values(categoryCollections).forEach(coll => myMap.geoObjects.remove(coll));
            categoryCollections = {};

            if (locationsToRender.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; padding:30px; color:#9ca3af; font-size:0.9rem;">Ничего не найдено 🔍</div>';
                renderTopCatFilter([]);
                return;
            }

            const activeCategoriesList = Object.keys(grouped);
            renderTopCatFilter(activeCategoriesList);

            activeCategoriesList.forEach(catName => {
                if (categoryVisibility[catName] === undefined) categoryVisibility[catName] = true;

                const collection = new ymaps.GeoObjectCollection({}, { visible: categoryVisibility[catName] });
                categoryCollections[catName] = collection;
                myMap.geoObjects.add(collection);

                const groupEl = document.createElement('div');
                groupEl.className = 'category-group';
                const isVisible = categoryVisibility[catName];
                
                groupEl.innerHTML = `
                    <div class="category-header">
                        <div class="category-title-wrap" onclick="toggleAccordion(this)">
                            <span class="category-title">${catName}</span>
                            <span class="category-count">${grouped[catName].length}</span>
                        </div>
                        <div class="category-controls">
                            <button id="pub-cat-icon-${encodeURIComponent(catName)}" class="toggle-visibility-btn" onclick="toggleCategoryMap('${catName}', this, event)">
                                ${isVisible ? '👁️' : '🙈'}
                            </button>
                            <span class="chevron" onclick="toggleAccordion(this)">▼</span>
                        </div>
                    </div>
                    <div class="category-content"></div>
                `;

                const contentEl = groupEl.querySelector('.category-content');

                grouped[catName].forEach(loc => {
                    const categoryIcon = loc.category ? loc.category.split(' ')[0] : '📍';
                    const pinColor = getCategoryPinColor(loc.category);

                    const layout = ymaps.templateLayoutFactory.createClass(
                        `<div class="custom-map-pin" style="background: ${pinColor};"><span>${categoryIcon}</span></div>`
                    );

                    const placemark = new ymaps.Placemark([loc.lat, loc.lng], {
                        hintContent: loc.title,
                        balloonContent: createBalloonHTML(loc)
                    }, {
                        iconLayout: layout,
                        iconOffset: [-19, -19],
                        iconShape: { type: 'Circle', coordinates: [19, 19], radius: 19 },
                        cursor: 'pointer'
                    });

                    placemark.events.add('click', () => {
                        activeBalloonPlacemark = placemark;
                        highlightLocationCard(loc.id);
                    });
                    collection.add(placemark);

                    const cardEl = document.createElement('div');
                    cardEl.className = 'location-card'; cardEl.id = `card-${loc.id}`;
                    cardEl.onclick = (e) => {
                        if (!e.target.classList.contains('card-photo-thumb') && !e.target.classList.contains('copy-btn') && !e.target.classList.contains('route-btn')) {
                            selectLocationOnMap(loc, placemark);
                        }
                    };

                    let photosHtml = '';
                    if (loc.images && Array.isArray(loc.images) && loc.images.length > 0) {
                        photosHtml = `<div class="card-photos">
                            ${loc.images.map((imgUrl, index) => `<img src="${imgUrl}" class="card-photo-thumb" onclick="openLightboxByUrl('${loc.id}', ${index}, event)">`).join('')}
                        </div>`;
                    }

                    const routeUrl = `https://yandex.ru/maps/?rtext=~${loc.lat},${loc.lng}`;
                    const safeAddr = escapeQuotes(loc.address);

                    cardEl.innerHTML = `
                        <div class="card-title">${loc.title}</div>
                        <div class="card-address-block">
                            ${loc.address ? `<div class="card-address">📍 ${loc.address}</div>` : ''}
                            <div class="card-actions-row">
                                ${loc.address ? `<button class="copy-btn" onclick="copyAddress('${safeAddr}', event, this)">📋 Копировать</button>` : ''}
                                <a href="${routeUrl}" target="_blank" rel="noopener" class="route-btn" onclick="event.stopPropagation();">🧭 Маршрут</a>
                            </div>
                        </div>
                        ${renderMetroBadges(loc.metro)}
                        ${loc.description ? `<div class="card-desc">${loc.description}</div>` : ''}
                        ${photosHtml}
                    `;
                    contentEl.appendChild(cardEl);
                });
                listEl.appendChild(groupEl);
            });
        }

        function createBalloonHTML(loc) {
            let photosHtml = '';
            if (loc.images && Array.isArray(loc.images) && loc.images.length > 0) {
                photosHtml = `<div class="balloon-photos">
                    ${loc.images.map((img, idx) => `<img src="${img}" class="balloon-photo-img" onclick="openLightboxByUrl('${loc.id}', ${idx}, event)">`).join('')}
                </div>`;
            }
            const routeUrl = `https://yandex.ru/maps/?rtext=~${loc.lat},${loc.lng}`;
            const safeAddr = escapeQuotes(loc.address);

            let metroHtml = '';
            if (loc.metro && Array.isArray(loc.metro) && loc.metro.length > 0) {
                metroHtml = `<div class="balloon-metro-block">${loc.metro.map(m => {
                    const isMck = (m.name && m.name.includes('МЦК')) || m.color === '#DF4842';
                    return `
                    <span class="metro-badge">
                        ${getMetroSvg(m.color || '#EF161E', isMck)}
                        ${m.name} ${m.time ? `<span style="color:#64748b; font-weight:400;">(${m.time} мин)</span>` : ''}
                    </span>
                `}).join('')}</div>`;
            }

            return `
                <div class="balloon-wrapper">
                    <div class="balloon-title">${loc.title}</div>
                    <div class="balloon-address-block">
                        ${loc.address ? `<div class="balloon-address">📍 ${loc.address}</div>` : ''}
                        <div class="balloon-actions-row">
                            ${loc.address ? `<button class="balloon-btn balloon-copy-btn" onclick="copyAddress('${safeAddr}', event, this)">📋 Копировать</button>` : ''}
                            <a href="${routeUrl}" target="_blank" rel="noopener" class="balloon-btn balloon-route-btn">🧭 Маршрут</a>
                        </div>
                    </div>
                    ${metroHtml}
                    ${loc.description ? `<div class="balloon-desc">${loc.description}</div>` : ''}
                    ${photosHtml}
                </div>
            `;
        }

        function renderTopCatFilter(categories) {
            const container = document.getElementById('catChipsScroll');
            container.innerHTML = '';
            if (!categories || categories.length === 0) return;

            categories.forEach(catName => {
                const isVis = categoryVisibility[catName] !== false;
                const chip = document.createElement('div');
                chip.className = `cat-chip ${isVis ? 'active' : 'disabled'}`;
                chip.innerHTML = `<span>${catName}</span>`;
                chip.onclick = () => {
                    categoryVisibility[catName] = !categoryVisibility[catName];
                    const nextState = categoryVisibility[catName];
                    if (categoryCollections[catName]) categoryCollections[catName].options.set('visible', nextState);
                    
                    if (nextState) { chip.classList.remove('disabled'); chip.classList.add('active'); }
                    else { chip.classList.remove('active'); chip.classList.add('disabled'); }
                    
                    const listIcon = document.getElementById(`pub-cat-icon-${encodeURIComponent(catName)}`);
                    if (listIcon) listIcon.innerText = nextState ? '👁️' : '🙈';

                    updateToggleAllBtnState();
                };
                container.appendChild(chip);
            });
            updateToggleAllBtnState();
        }

        function toggleAllCategories() {
            allVisibleState = !allVisibleState;
            Object.keys(categoryCollections).forEach(catName => {
                categoryVisibility[catName] = allVisibleState;
                if (categoryCollections[catName]) categoryCollections[catName].options.set('visible', allVisibleState);

                const listIcon = document.getElementById(`pub-cat-icon-${encodeURIComponent(catName)}`);
                if (listIcon) listIcon.innerText = allVisibleState ? '👁️' : '🙈';
            });

            document.querySelectorAll('#catChipsScroll .cat-chip').forEach(chip => {
                if (allVisibleState) { chip.classList.remove('disabled'); chip.classList.add('active'); }
                else { chip.classList.remove('active'); chip.classList.add('disabled'); }
            });
            updateToggleAllBtnState();
        }

        function updateToggleAllBtnState() {
            const toggleBtn = document.getElementById('toggleAllBtn');
            const hasActive = Object.values(categoryVisibility).some(v => v === true);
            if (hasActive) { allVisibleState = true; toggleBtn.classList.remove('off'); toggleBtn.innerText = '👁️ Все'; }
            else { allVisibleState = false; toggleBtn.classList.add('off'); toggleBtn.innerText = '🙈 Все'; }
        }

        function toggleCategoryMap(catName, btnEl, event) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            categoryVisibility[catName] = !categoryVisibility[catName];
            const isVis = categoryVisibility[catName];
            
            if (categoryCollections[catName]) categoryCollections[catName].options.set('visible', isVis);
            
            const listIcon = document.getElementById(`pub-cat-icon-${encodeURIComponent(catName)}`);
            if (listIcon) listIcon.innerText = isVis ? '👁️' : '🙈';

            renderTopCatFilter(Object.keys(categoryCollections));
        }

        function toggleAccordion(element) { element.closest('.category-group').classList.toggle('collapsed'); }

        function selectLocationOnMap(loc, placemark) {
            activeBalloonPlacemark = placemark;
            myMap.setCenter([loc.lat, loc.lng], 15, { duration: 300 }).then(() => placemark.balloon.open());
            document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));
            const card = document.getElementById(`card-${loc.id}`);
            if (card) card.classList.add('active');
            if (window.innerWidth <= 768) switchMobileView('map');
        }

        function highlightLocationCard(locId) {
            document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));
            const card = document.getElementById(`card-${locId}`);
            if (card) {
                card.classList.add('active');
                const group = card.closest('.category-group');
                if (group) group.classList.remove('collapsed');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        /* LIGHTBOX */
        function openLightboxByUrl(locId, index, event) {
            if (event) event.stopPropagation();
            const loc = allLocations.find(l => l.id === locId);
            if (!loc || !loc.images) return;
            currentGallery = loc.images; currentImageIdx = index;
            updateLightboxImage();
            document.getElementById('lightbox').classList.add('active');
        }

        function updateLightboxImage() {
            document.getElementById('lightbox-img').src = currentGallery[currentImageIdx];
            document.getElementById('lightbox-counter').innerText = `${currentImageIdx + 1} из ${currentGallery.length}`;
        }

        function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
        function nextImage() { if (!currentGallery.length) return; currentImageIdx = (currentImageIdx + 1) % currentGallery.length; updateLightboxImage(); }
        function prevImage() { if (!currentGallery.length) return; currentImageIdx = (currentImageIdx - 1 + currentGallery.length) % currentGallery.length; updateLightboxImage(); }

        let touchStartX = 0;
        let touchEndX = 0;
        const lightboxEl = document.getElementById('lightbox');
        
        lightboxEl.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightboxEl.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 45) nextImage();
            if (touchEndX > touchStartX + 45) prevImage();
        }, { passive: true });

        function switchMobileView(view) {
            const btnMap = document.getElementById('btn-map-view');
            const btnList = document.getElementById('btn-list-view');
            if (view === 'map') {
                document.body.classList.remove('show-list');
                btnMap.classList.add('active'); btnList.classList.remove('active');
                setTimeout(() => { if (myMap) myMap.container.fitToViewport(); }, 50);
            } else {
                document.body.classList.add('show-list');
                btnList.classList.add('active'); btnMap.classList.remove('active');
                toggleMobileSearch(false);
            }
        }

        // Запуск проверки авторизации
        checkAuthAndInit();
    </script>
</body>
</html>
